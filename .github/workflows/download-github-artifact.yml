name: Download GitHub Artifact by ID

on:
  workflow_dispatch:
    inputs:
      source_repository:
        description: "Source repository in owner/repository format"
        required: true
        type: string
      artifact_id:
        description: "GitHub Actions artifact ID"
        required: true
        type: string
      destination_folder:
        description: "Folder where downloaded files will be saved"
        required: true
        default: "vendor/downloaded-artifacts"
        type: string

permissions:
  contents: write
  actions: read

jobs:
  download:
    name: Download and Save Artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout destination repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Validate inputs
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          DESTINATION_FOLDER: ${{ inputs.destination_folder }}
        run: |
          set -euo pipefail

          if [[ ! "$SOURCE_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::Repository must use owner/repository format."
            exit 1
          fi

          if [[ ! "$ARTIFACT_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Artifact ID must contain digits only."
            exit 1
          fi

          if [[ -z "$DESTINATION_FOLDER" ||
                "$DESTINATION_FOLDER" == /* ||
                "$DESTINATION_FOLDER" == *".."* ]]; then
            echo "::error::Destination must be a safe relative folder path."
            exit 1
          fi

          echo "Source repository: $SOURCE_REPOSITORY"
          echo "Artifact ID: $ARTIFACT_ID"
          echo "Destination: $DESTINATION_FOLDER"

      - name: Download artifact archive
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ARTIFACT_DOWNLOAD_TOKEN || github.token }}
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
        run: |
          set -euo pipefail

          mkdir -p downloaded-archive

          API_URL="https://api.github.com/repos/${SOURCE_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}"

          echo "Checking artifact metadata..."

          curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$API_URL" \
            -o downloaded-archive/metadata.json

          if ! jq -e '.id and (.expired == false)' \
              downloaded-archive/metadata.json >/dev/null; then
            echo "::error::Artifact is expired or its metadata is invalid."
            cat downloaded-archive/metadata.json
            exit 1
          fi

          ARTIFACT_NAME=$(jq -r '.name' downloaded-archive/metadata.json)

          echo "Artifact name: $ARTIFACT_NAME"

          DOWNLOAD_URL="${API_URL}/zip"

          curl --fail --location --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$DOWNLOAD_URL" \
            -o downloaded-archive/artifact.zip

          if ! unzip -t downloaded-archive/artifact.zip; then
            echo "::error::Downloaded file is not a valid ZIP archive."
            exit 1
          fi

          echo "Downloaded artifact successfully."

      - name: Extract artifact into destination folder
        shell: bash
        env:
          DESTINATION_FOLDER: ${{ inputs.destination_folder }}
        run: |
          set -euo pipefail

          DESTINATION="$GITHUB_WORKSPACE/$DESTINATION_FOLDER"

          mkdir -p "$DESTINATION"

          # Inspect archive paths before extracting.
          python3 - <<'PY'
          import zipfile
          from pathlib import PurePosixPath

          archive = "downloaded-archive/artifact.zip"

          with zipfile.ZipFile(archive) as z:
              for item in z.infolist():
                  name = item.filename

                  if "\\" in name:
                      raise SystemExit(
                          f"Unsafe archive path: {name}"
                      )

                  path = PurePosixPath(name)

                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(
                          f"Unsafe archive path: {name}"
                      )

                  if path.parts and ":" in path.parts[0]:
                      raise SystemExit(
                          f"Unsafe archive path: {name}"
                      )

          print("Archive paths validated.")
          PY

          unzip -o downloaded-archive/artifact.zip -d "$DESTINATION"

          echo "Extracted files:"
          find "$DESTINATION" -maxdepth 5 -type f -print

          if ! find "$DESTINATION" -type f -print -quit | grep -q .; then
            echo "::error::The extracted artifact contains no files."
            exit 1
          fi

      - name: Upload downloaded files as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-artifact-${{ inputs.artifact_id }}
          path: ${{ inputs.destination_folder }}/
          if-no-files-found: error
          retention-days: 14

      - name: Commit downloaded files to repository
        shell: bash
        env:
          DESTINATION_FOLDER: ${{ inputs.destination_folder }}
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- "$DESTINATION_FOLDER"

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Import artifact ${ARTIFACT_ID} from ${SOURCE_REPOSITORY}"

          git push origin "HEAD:${GITHUB_REF_NAME}"
