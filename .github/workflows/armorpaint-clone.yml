name: ArmorPaint - Clone and Prepare Source

# Clones one ArmorPaint release straight into its folder under sources/ and
# commits it to this repository. Nothing is parked in a workflow artifact, so
# no separate "migrate" step is required.
#
#   ArmorPaint 1.0  ->  upstream tag 26.09  ->  sources/armorpaint-260/
#   ArmorPaint 0.9  ->  upstream tag 23.09  ->  sources/armorpaint-09/
#
# The workflow only runs when started by hand (workflow_dispatch). Its own
# commit uses GITHUB_TOKEN, which never triggers another workflow run, and the
# commit message carries [skip ci] as an additional guard.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "ArmorPaint version to clone (1.0 = tag 26.09, 0.9 = tag 23.09)"
        type: choice
        required: true
        default: "1.0"
        options:
          - "1.0"
          - "0.9"
      replace_existing:
        description: "Replace the source already present in the version's folder (build output is kept)"
        type: boolean
        required: false
        default: true

permissions:
  contents: write

concurrency:
  group: armorpaint-clone-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  clone:
    name: Clone ArmorPaint ${{ inputs.version }} source
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ------------------------------------------------------------------
      # Work out which tag and folder belong to the selected version and
      # prove the tag really exists and points where we expect.
      # ------------------------------------------------------------------
      - name: Resolve version and verify upstream tag
        id: resolve
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          REPO_URL="https://github.com/armory3d/armorpaint"

          case "$VERSION" in
            "1.0")
              TAG="26.09"
              FOLDER="sources/armorpaint-260"
              EXPECTED="baf9758e0b59a53b069595057a4ca59df31266de"
              OTHER_TAG="23.09"
              ;;
            "0.9")
              TAG="23.09"
              FOLDER="sources/armorpaint-09"
              EXPECTED="b658b626a24eb7fe13330c8526f794555547dc19"
              OTHER_TAG="26.09"
              ;;
            *)
              echo "::error::Unsupported ArmorPaint version: $VERSION"
              exit 1
              ;;
          esac

          resolve_tag() {
            # Prefer the peeled commit of an annotated tag, else the tag object.
            local lines peeled plain
            lines=$(git ls-remote "$REPO_URL" "refs/tags/$1" "refs/tags/$1^{}")
            peeled=$(printf '%s\n' "$lines" | awk '/\^\{\}$/ {print $1}')
            plain=$(printf '%s\n' "$lines" | awk '!/\^\{\}$/ && NF {print $1}')
            printf '%s' "${peeled:-$plain}"
          }

          echo "Upstream tags:"
          git ls-remote --tags --refs "$REPO_URL" | sed 's#refs/tags/##' | awk '{print "  " substr($1,1,12) "  " $2}'

          COMMIT=$(resolve_tag "$TAG")
          OTHER_COMMIT=$(resolve_tag "$OTHER_TAG")

          if [[ -z "$COMMIT" ]]; then
            echo "::error::Tag '$TAG' does not exist in $REPO_URL."
            exit 1
          fi

          if [[ "$COMMIT" != "$EXPECTED" ]]; then
            echo "::error::Tag '$TAG' now points at $COMMIT but ArmorPaint $VERSION was verified at $EXPECTED. Review the upstream tag before cloning."
            exit 1
          fi

          if [[ "$COMMIT" == "$OTHER_COMMIT" ]]; then
            echo "::error::Tags '$TAG' and '$OTHER_TAG' point at the same commit; refusing to clone one version into both folders."
            exit 1
          fi

          echo ""
          echo "ArmorPaint $VERSION -> tag $TAG -> $COMMIT -> $FOLDER"

          {
            echo "tag=$TAG"
            echo "folder=$FOLDER"
            echo "commit=$COMMIT"
          } >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------------
      # Clone with LF line endings so the files are identical to upstream.
      # ------------------------------------------------------------------
      - name: Clone upstream source into staging
        id: clone
        shell: bash
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          EXPECTED_COMMIT: ${{ steps.resolve.outputs.commit }}
        run: |
          set -euo pipefail

          STAGE="$RUNNER_TEMP/armorpaint-stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"

          git -c core.autocrlf=false -c core.eol=lf -c advice.detachedHead=false \
            clone --depth 1 --branch "$TAG" \
            https://github.com/armory3d/armorpaint "$STAGE/src"

          HEAD_COMMIT=$(git -C "$STAGE/src" rev-parse HEAD)
          if [[ "$HEAD_COMMIT" != "$EXPECTED_COMMIT" ]]; then
            echo "::error::Cloned $HEAD_COMMIT but expected $EXPECTED_COMMIT."
            exit 1
          fi

          {
            echo "stage=$STAGE"
            echo "commit_date=$(git -C "$STAGE/src" show -s --format=%cI HEAD)"
            echo "commit_subject=$(git -C "$STAGE/src" show -s --format=%s HEAD)"
          } >> "$GITHUB_OUTPUT"

          echo "Cloned $TAG at $HEAD_COMMIT"

      # ------------------------------------------------------------------
      # Upstream pins dependencies as git submodules and some of those URLs
      # are gone. Resolve every pin, copy the source submodules into the
      # tree and record the toolchain pins in a lock file.
      # ------------------------------------------------------------------
      - name: Resolve pinned submodules
        shell: bash
        env:
          STAGE: ${{ steps.clone.outputs.stage }}
          TAG: ${{ steps.resolve.outputs.tag }}
          COMMIT: ${{ steps.resolve.outputs.commit }}
        run: |
          set -euo pipefail

          python3 -I .github/scripts/armorpaint_fetch_submodules.py \
            --source "$STAGE/src" \
            --lock "$STAGE/ARMORPAINT_DEPENDENCIES.json" \
            --tag "$TAG" \
            --commit "$COMMIT"

      # ------------------------------------------------------------------
      # Validate the staged tree, install it into sources/, validate again.
      # ------------------------------------------------------------------
      - name: Validate and install source
        id: install
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          REPLACE_EXISTING: ${{ inputs.replace_existing }}
          STAGE: ${{ steps.clone.outputs.stage }}
          TAG: ${{ steps.resolve.outputs.tag }}
          FOLDER: ${{ steps.resolve.outputs.folder }}
          COMMIT: ${{ steps.resolve.outputs.commit }}
          COMMIT_DATE: ${{ steps.clone.outputs.commit_date }}
          COMMIT_SUBJECT: ${{ steps.clone.outputs.commit_subject }}
        run: |
          set -euo pipefail

          # Files that must exist for the version's build system to work.
          if [[ "$VERSION" == "1.0" ]]; then
            REQUIRED=(
              "paint/project.js"
              "paint/sources/main.c"
              "base/project.js"
              "base/make"
              "base/make.bat"
              "base/tools/make.js"
              "base/tools/bin/windows_x64/amake.exe"
            )
            FORBIDDEN=("armorpaint/khafile.js" "armorcore/kfile.js")
          else
            REQUIRED=(
              "armorpaint/khafile.js"
              "armorpaint/kincflags.js"
              "base/khafile.js"
              "misc/pad/khafile.js"
              "armorcore/kfile.js"
              "armorcore/make.js"
              "armorcore/Sources/main.cpp"
              "armorcore/Kinc/kfile.js"
              "armorcore/Kinc/make.bat"
              "armorcore/Kinc/Sources"
              "ARMORPAINT_DEPENDENCIES.json"
            )
            FORBIDDEN=("paint/project.js" "base/make.bat")
          fi

          verify_tree() {
            local dir="$1" failed=0 item
            for item in "${REQUIRED[@]}"; do
              if [[ -e "$dir/$item" ]]; then
                echo "  [ok]      $item"
              else
                echo "  [MISSING] $item"
                failed=1
              fi
            done
            for item in "${FORBIDDEN[@]}"; do
              if [[ -e "$dir/$item" ]]; then
                echo "  [WRONG VERSION] $item belongs to the other ArmorPaint version"
                failed=1
              fi
            done
            if [[ "$VERSION" == "1.0" ]]; then
              local amake="$dir/base/tools/bin/windows_x64/amake.exe"
              if [[ -f "$amake" && $(stat -c '%s' "$amake") -lt 100000 ]]; then
                echo "  [BAD] amake.exe is only $(stat -c '%s' "$amake") bytes (Git LFS pointer?)"
                failed=1
              fi
            fi
            return "$failed"
          }

          SRC="$STAGE/src"

          # The lock file is part of the committed source, so it must exist
          # before the staged tree is validated.
          cp "$STAGE/ARMORPAINT_DEPENDENCIES.json" "$SRC/ARMORPAINT_DEPENDENCIES.json"

          echo "Validating staged source:"
          if ! verify_tree "$SRC"; then
            echo "::error::The cloned ArmorPaint $VERSION source is incomplete. Nothing was changed in $FOLDER."
            exit 1
          fi

          # GitHub rejects files of 100 MB or more, so stop before committing.
          mapfile -t TOO_BIG < <(find "$SRC" -path "$SRC/.git" -prune -o -type f -size +95M -print)
          if (( ${#TOO_BIG[@]} > 0 )); then
            printf '::error::File too large for a normal Git commit: %s\n' "${TOO_BIG[@]}"
            exit 1
          fi

          # The staging .git directory is not part of the committed source.
          rm -rf "$SRC/.git"

          {
            echo "ArmorPaint Source Manifest"
            echo "=========================="
            echo ""
            echo "Version:             ArmorPaint $VERSION"
            echo "Upstream repository: https://github.com/armory3d/armorpaint"
            echo "Upstream tag:        $TAG"
            echo "Upstream commit:     $COMMIT"
            echo "Commit date:         $COMMIT_DATE"
            echo "Commit subject:      $COMMIT_SUBJECT"
            echo "Installed in:        $FOLDER"
            echo "Line endings:        unchanged from upstream (LF)"
            echo ""
            echo "Pinned submodules (full detail in ARMORPAINT_DEPENDENCIES.json):"
            python3 -I - "$SRC/ARMORPAINT_DEPENDENCIES.json" <<'PY'
          import json, sys
          rows = json.load(open(sys.argv[1]))["submodules"]
          if not rows:
              print("  none")
          for r in rows:
              how = "copied into this folder" if r["materialized"] else "fetched at compile time"
              print("  %-36s %s  %s" % (r["path"], r["sha"][:12], how))
          PY
          } > "$SRC/ARMORPAINT_SOURCE_MANIFEST.txt"

          # Install. Build products from earlier compile runs are preserved.
          if [[ "$REPLACE_EXISTING" != "true" && -f "$FOLDER/ARMORPAINT_SOURCE_MANIFEST.txt" ]]; then
            echo "::error::$FOLDER already contains source. Re-run with 'replace_existing' enabled to overwrite it."
            exit 1
          fi

          mkdir -p "$FOLDER"
          rsync -a --delete \
            --exclude='/build-output/' \
            --exclude='/build-diagnostics/' \
            --exclude='/ArmorPaint-*-Windows-x64.zip' \
            --exclude='/ArmorPaint-*-Windows-x64.zip.part*' \
            --exclude='/ArmorPaint-*-Windows-x64.zip.sha256' \
            "$SRC/" "$FOLDER/"

          echo ""
          echo "Validating installed source in $FOLDER:"
          if ! verify_tree "$FOLDER"; then
            echo "::error::Installed source in $FOLDER failed validation."
            exit 1
          fi

          FILE_COUNT=$(find "$FOLDER" -type f | wc -l | tr -d ' ')
          SIZE=$(du -sh "$FOLDER" | cut -f1)
          echo ""
          echo "Installed $FILE_COUNT files ($SIZE) into $FOLDER"

          {
            echo "file_count=$FILE_COUNT"
            echo "size=$SIZE"
          } >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------------
      # Commit only the version's own folder and push it back.
      # ------------------------------------------------------------------
      - name: Commit and push source
        id: publish
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          FOLDER: ${{ steps.resolve.outputs.folder }}
          TAG: ${{ steps.resolve.outputs.tag }}
          COMMIT: ${{ steps.resolve.outputs.commit }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config core.autocrlf false
          git config http.postBuffer 524288000

          # -f: upstream .gitignore files must not hide any source file.
          git add -A -f -- "$FOLDER"

          if git diff --cached --quiet; then
            echo "$FOLDER already matches upstream tag $TAG. Nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Never touch anything outside the selected version's folder.
          OUTSIDE=$(git diff --cached --name-only | grep -v "^$FOLDER/" || true)
          if [[ -n "$OUTSIDE" ]]; then
            echo "::error::Refusing to commit files outside $FOLDER:"
            echo "$OUTSIDE"
            exit 1
          fi

          # Final guard against GitHub's 100 MB per-file limit.
          while IFS= read -r -d '' file; do
            if [[ -f "$file" && $(stat -c '%s' "$file") -ge 100000000 ]]; then
              echo "::error::File exceeds GitHub's 100 MB limit: $file"
              exit 1
            fi
          done < <(git diff --cached --name-only --diff-filter=AM -z)

          git diff --cached --shortstat

          # The manifest has no timestamp, so re-running the workflow on an
          # unchanged tag produces no commit at all.
          git commit -q -m "Clone ArmorPaint $VERSION source ($TAG @ ${COMMIT:0:12}) [skip ci]" \
            -m "Workflow run $GITHUB_RUN_ID"

          pushed=false
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:$BRANCH"; then
              pushed=true
              break
            fi
            echo "Push attempt $attempt failed. Rebasing onto the latest $BRANCH and retrying."
            git fetch origin "$BRANCH"
            git rebase "origin/$BRANCH"
            sleep $((attempt * 5))
          done

          if [[ "$pushed" != "true" ]]; then
            echo "::error::Could not push to $BRANCH after 5 attempts."
            exit 1
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          TAG: ${{ steps.resolve.outputs.tag }}
          COMMIT: ${{ steps.resolve.outputs.commit }}
          FOLDER: ${{ steps.resolve.outputs.folder }}
          FILE_COUNT: ${{ steps.install.outputs.file_count }}
          SIZE: ${{ steps.install.outputs.size }}
          CHANGED: ${{ steps.publish.outputs.changed }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## ArmorPaint $VERSION source"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Status | $JOB_STATUS |"
            echo "| Upstream tag | \`$TAG\` |"
            echo "| Upstream commit | \`$COMMIT\` |"
            echo "| Folder | \`$FOLDER\` |"
            echo "| Files / size | ${FILE_COUNT:-n/a} / ${SIZE:-n/a} |"
            echo "| New commit pushed | ${CHANGED:-n/a} |"
            echo ""
            echo "Cloning does not prove the source compiles. Run **Compile ArmorPaint for Windows** next."
          } >> "$GITHUB_STEP_SUMMARY"
