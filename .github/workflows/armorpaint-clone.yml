name: Build ArmorPaint (Windows)

on:
  workflow_dispatch:
    inputs:
      build_260:
        description: "Build ArmorPaint 26.09"
        type: boolean
        default: true

      build_250:
        description: "Build ArmorPaint 25.0 (existing commit)"
        type: boolean
        default: true

      build_09:
        description: "Build ArmorPaint 0.9 Sept (23.09)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build_260:
    name: Build ArmorPaint 26.09
    if: ${{ inputs.build_260 }}
    runs-on: windows-latest

    steps:
      - name: Clone ArmorPaint 26.09 source
        uses: actions/checkout@v4
        with:
          repository: armory3d/armorpaint
          ref: "26.09"
          path: armorpaint-260
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Inspect source and build scripts
        shell: pwsh
        run: |
          $root = "armorpaint-260"

          if (!(Test-Path "$root/paint")) {
            throw "The paint directory was not found."
          }

          if (!(Test-Path "$root/base/make")) {
            throw "The base/make build script was not found."
          }

          git -C $root submodule status

      - name: Compile ArmorPaint
        shell: pwsh
        run: |
          Set-Location armorpaint-260/paint

          bash ../base/make --compile

          if ($LASTEXITCODE -ne 0) {
            throw "ArmorPaint 26.09 compilation failed."
          }

      - name: Package Windows executable
        shell: pwsh
        run: |
          $root = "armorpaint-260"

          $candidates = @(
            "$root/paint/build",
            "$root/build",
            "$root/paint/Krom"
          )

          $output = $null

          foreach ($candidate in $candidates) {
            if (Test-Path $candidate) {
              $exe = Get-ChildItem $candidate -Filter "*.exe" -File -Recurse |
                Select-Object -First 1

              if ($exe) {
                $output = $candidate
                break
              }
            }
          }

          if (!$output) {
            Get-ChildItem $root -Filter "*.exe" -File -Recurse |
              Select-Object -ExpandProperty FullName

            throw "No executable found. Inspect the build logs."
          }

          Compress-Archive `
            -Path "$output/*" `
            -DestinationPath "armorpaint-26.09-win64.zip" `
            -CompressionLevel Optimal

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: armorpaint-26.09-win64
          path: armorpaint-26.09-win64.zip
          if-no-files-found: error

  build_250:
    name: Build ArmorPaint 25.0
    if: ${{ inputs.build_250 }}
    runs-on: windows-latest

    steps:
      - name: Clone ArmorPaint 2025 source
        uses: actions/checkout@v4
        with:
          repository: armory3d/armorpaint
          ref: "6c2e887777930cd72606a4360a1d33e1e48476f0"
          path: armorpaint-250
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Inspect source and build scripts
        shell: pwsh
        run: |
          $root = "armorpaint-250"

          if (!(Test-Path "$root/paint")) {
            throw "The paint directory was not found."
          }

          if (!(Test-Path "$root/base/make")) {
            throw "The base/make build script was not found."
          }

          git -C $root submodule status

      - name: Compile ArmorPaint
        shell: pwsh
        run: |
          Set-Location armorpaint-250/paint

          bash ../base/make --compile

          if ($LASTEXITCODE -ne 0) {
            throw "ArmorPaint 25.0 compilation failed."
          }

      - name: Package Windows executable
        shell: pwsh
        run: |
          $root = "armorpaint-250"

          $candidates = @(
            "$root/paint/build",
            "$root/build",
            "$root/paint/Krom"
          )

          $output = $null

          foreach ($candidate in $candidates) {
            if (Test-Path $candidate) {
              $exe = Get-ChildItem $candidate -Filter "*.exe" -File -Recurse |
                Select-Object -First 1

              if ($exe) {
                $output = $candidate
                break
              }
            }
          }

          if (!$output) {
            Get-ChildItem $root -Filter "*.exe" -File -Recurse |
              Select-Object -ExpandProperty FullName

            throw "No executable found. Inspect the build logs."
          }

          Compress-Archive `
            -Path "$output/*" `
            -DestinationPath "armorpaint-25.0-win64.zip" `
            -CompressionLevel Optimal

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: armorpaint-25.0-win64
          path: armorpaint-25.0-win64.zip
          if-no-files-found: error

  build_09:
    name: Build ArmorPaint 0.9 Sept
    if: ${{ inputs.build_09 }}
    runs-on: windows-latest

    steps:
      - name: Clone ArmorPaint 0.9 Sept source
        uses: actions/checkout@v4
        with:
          repository: armory3d/armorpaint
          ref: "23.09"
          path: armorpaint-09-sept
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Verify legacy build files
        shell: pwsh
        run: |
          $root = "armorpaint-09-sept"

          if (!(Test-Path "$root/paint/Kromx")) {
            throw "The expected legacy Kromx directory was not found."
          }

      - name: Compile legacy Windows build
        shell: pwsh
        run: |
          Set-Location armorpaint-09-sept/paint

          node Kromx/make -g direct3d11

          if ($LASTEXITCODE -ne 0) {
            throw "Kromx project generation failed."
          }

          Set-Location Kromx

          if (Test-Path "V8/Libraries/win32/release/v8_monolith.7z") {
            7z x V8/Libraries/win32/release/v8_monolith.7z -y

            if ($LASTEXITCODE -ne 0) {
              throw "V8 library extraction failed."
            }
          }

          node Kinc/make -g direct3d11

          if ($LASTEXITCODE -ne 0) {
            throw "Kinc project generation failed."
          }

          $solution = Get-ChildItem -Filter "*.sln" -File |
            Select-Object -First 1

          if (!$solution) {
            throw "No Visual Studio solution was generated."
          }

          msbuild $solution.FullName /m /p:Configuration=Release /p:Platform=x64

          if ($LASTEXITCODE -ne 0) {
            throw "Legacy ArmorPaint compilation failed."
          }

      - name: Package ArmorPaint 0.9 Sept
        shell: pwsh
        run: |
          $root = "armorpaint-09-sept"

          $exe = Get-ChildItem $root -Filter "*.exe" -File -Recurse |
            Where-Object {
              $_.FullName -match "\\(build|Release|x64)\\"
            } |
            Select-Object -First 1

          if (!$exe) {
            Get-ChildItem $root -Filter "*.exe" -File -Recurse |
              Select-Object -ExpandProperty FullName

            throw "No compiled legacy executable was found."
          }

          $output = Split-Path $exe.FullName -Parent

          Compress-Archive `
            -Path "$output/*" `
            -DestinationPath "armorpaint-0.9-sept-win64.zip" `
            -CompressionLevel Optimal

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: armorpaint-0.9-sept-win64
          path: armorpaint-0.9-sept-win64.zip
          if-no-files-found: error

  release:
    name: Publish ArmorPaint Windows Builds
    needs:
      - build_260
      - build_250
      - build_09

    if: >-
      ${{
        always() &&
        !cancelled() &&
        (
          inputs.build_260 ||
          inputs.build_250 ||
          inputs.build_09
        ) &&
        (
          needs.build_260.result == 'success' ||
          needs.build_250.result == 'success' ||
          needs.build_09.result == 'success'
        )
      }}

    runs-on: ubuntu-latest

    steps:
      - name: Download successful build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: armorpaint-*-win64
          merge-multiple: false

      - name: Verify release packages
        shell: bash
        run: |
          find artifacts -type f -name "*.zip" -print

          if ! find artifacts -type f -name "*.zip" | grep -q .; then
            echo "No ZIP packages were produced."
            exit 1
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: armorpaint-build-${{ github.run_number }}
          name: ArmorPaint Windows Build ${{ github.run_number }}
          draft: false
          prerelease: true
          files: artifacts/**/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
