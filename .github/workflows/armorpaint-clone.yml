name: Build ArmorPaint Windows

on:
  workflow_dispatch:
    inputs:
      build_260:
        description: "Build ArmorPaint 26.09"
        type: boolean
        default: true
        required: true

      build_250:
        description: "Build ArmorPaint 2025"
        type: boolean
        default: true
        required: true

      build_09:
        description: "Build ArmorPaint 0.9 September"
        type: boolean
        default: false
        required: true

permissions:
  contents: write

jobs:
  build_260:
    name: Build ArmorPaint 26.09
    if: ${{ inputs.build_260 }}
    runs-on: windows-latest

    steps:
      - name: Checkout ArmorPaint 26.09
        uses: actions/checkout@v4
        with:
          repository: armory3d/armorpaint
          ref: "26.09"
          path: armorpaint-260
          submodules: recursive
          fetch-depth: 0

      - name: Configure Visual Studio
        uses: microsoft/setup-msbuild@v2

      - name: Verify source files
        shell: pwsh
        run: |
          $root = "armorpaint-260"

          if (!(Test-Path "$root/paint")) {
            throw "ArmorPaint paint directory was not found."
          }

          if (!(Test-Path "$root/base/make.bat")) {
            throw "Windows build script base/make.bat was not found."
          }

          if (!(Test-Path "$root/base/tools/bin/windows_x64/amake.exe")) {
            throw "Windows amake.exe was not found."
          }

          git -C $root submodule status

      - name: Generate Visual Studio project
        shell: pwsh
        run: |
          Set-Location "armorpaint-260/paint"

          & "..\base\make"

          if ($LASTEXITCODE -ne 0) {
            throw "ArmorPaint project generation failed."
          }

          $solutions = Get-ChildItem "build" `
            -Filter "*.sln" `
            -File `
            -Recurse

          if (!$solutions) {
            throw "No Visual Studio solution was generated."
          }

          $solutions | ForEach-Object {
            Write-Host "Generated solution: $($_.FullName)"
          }

      - name: Compile ArmorPaint
        shell: pwsh
        run: |
          $root = "armorpaint-260/paint"

          $solutions = Get-ChildItem "$root/build" `
            -Filter "*.sln" `
            -File `
            -Recurse

          if (!$solutions) {
            throw "No Visual Studio solution is available."
          }

          $solution = $solutions | Select-Object -First 1

          Write-Host "Compiling: $($solution.FullName)"

          msbuild $solution.FullName `
            /m `
            /p:Configuration=Release `
            /p:Platform=x64

          if ($LASTEXITCODE -ne 0) {
            throw "ArmorPaint 26.09 compilation failed."
          }

      - name: Copy and package compiled files
        shell: pwsh
        run: |
          $root = "armorpaint-260/paint"

          $exe = Get-ChildItem "$root/build" `
            -Filter "ArmorPaint.exe" `
            -File `
            -Recurse |
            Select-Object -First 1

          if (!$exe) {
            Write-Host "Executable files found:"
            Get-ChildItem "$root/build" `
              -Filter "*.exe" `
              -File `
              -Recurse |
              Select-Object -ExpandProperty FullName

            throw "ArmorPaint.exe was not found."
          }

          $output = Split-Path $exe.FullName -Parent
          $package = "package-260"

          New-Item -ItemType Directory -Path $package -Force |
            Out-Null

          Copy-Item "$output/*" $package -Recurse -Force

          if (!(Test-Path "$package/ArmorPaint.exe")) {
            throw "ArmorPaint.exe was not copied into the package."
          }

          Compress-Archive `
            -Path "$package/*" `
            -DestinationPath "armorpaint-26.09-win64.zip" `
            -CompressionLevel Optimal

          Write-Host "Created armorpaint-26.09-win64.zip"

      - name: Upload ArmorPaint 26.09
        uses: actions/upload-artifact@v4
        with:
          name: armorpaint-26.09-win64
          path: armorpaint-26.09-win64.zip
          if-no-files-found: error
          retention-days: 30

  build_250:
    name: Build ArmorPaint 2025
    if: ${{ inputs.build_250 }}
    runs-on: windows-latest

    steps:
      - name: Checkout ArmorPaint 2025 source
        uses: actions/checkout@v4
        with:
          repository: armory3d/armorpaint
          ref: "6c2e887777930cd72606a4360a1d33e1e48476f0
