name: ArmorPaint - Compile for Windows x64

# Builds ArmorPaint 1.0 or 0.9 for Windows x64 with the Windows steps from each
# version's own readme. Only the ArmorPaint folders are used; the rest of the
# ArmorTools suite is never built.
#
#   ArmorPaint 1.0   folder   sources/armorpaint-260/paint
#       readme       sources/armorpaint-260/readme.md
#       steps        ..\base\make.bat                 -> build\ArmorPaint.sln
#                    MSBuild build\ArmorPaint.sln     Release | x64
#
#   ArmorPaint 0.9   folder   sources/armorpaint-09/armorpaint
#       readme       sources/armorpaint-09/armorpaint/README.md
#       steps        7z x v8_monolith.7z              (armorcore\v8\libraries\win32\release)
#                    ..\armorcore\Kinc\make --from ..\armorcore -g direct3d11
#                    MSBuild build\ArmorPaint.sln     Release | x64
#                    copy build\x64\Release\ArmorPaint.exe to build\krom
#
# Output, committed to the repository and uploaded as a GitHub artifact:
#   sources/<folder>/build-output/ArmorPaint-<v>-Windows-x64/
#   sources/<folder>/ArmorPaint-<v>-Windows-x64.zip
# Logs, committed but not packaged:
#   sources/<folder>/build-diagnostics/

on:
  workflow_dispatch:
    inputs:
      version:
        description: "ArmorPaint version to compile"
        type: choice
        required: true
        default: "1.0"
        options:
          - "1.0"
          - "0.9"

permissions:
  contents: write

concurrency:
  group: armorpaint-compile-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  compile:
    name: ArmorPaint ${{ inputs.version }} - Windows x64
    runs-on: windows-latest
    timeout-minutes: 180

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Enable long paths
        run: |
          $ErrorActionPreference = "Stop"
          git config --global core.longpaths true
          try {
            Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name LongPathsEnabled -Value 1 -Type DWord
            Write-Host "Windows long paths enabled."
          }
          catch {
            Write-Host "Could not enable Windows long paths (continuing): $($_.Exception.Message)"
          }

      - name: Check source folder
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:VERSION

          if ($version -eq "1.0") {
            $root = Join-Path $env:GITHUB_WORKSPACE "sources/armorpaint-260"
            $required = @(
              "readme.md",
              "paint/project.js",
              "base/make.bat",
              "base/tools/bin/windows_x64/amake.exe"
            )
          }
          else {
            $root = Join-Path $env:GITHUB_WORKSPACE "sources/armorpaint-09"
            $required = @(
              "armorpaint/README.md",
              "armorpaint/khafile.js",
              "armorcore/make.js",
              "armorcore/Kinc/make.bat",
              "armorcore/v8/libraries/win32/release/v8_monolith.7z"
            )
          }

          $missing = @()
          foreach ($rel in $required) {
            if (Test-Path -LiteralPath (Join-Path $root $rel)) {
              Write-Host "[ok]      $rel"
            }
            else {
              Write-Host "[MISSING] $rel"
              $missing += $rel
            }
          }

          if ($missing.Count -gt 0) {
            Write-Host "::error::ArmorPaint $version source is incomplete."
            throw "Missing: $($missing -join ', '). Run 'ArmorPaint - Clone and Prepare Source' for version $version first. The 0.9 build also needs armorcore/v8, which the clone does not copy yet."
          }

      # ------------------------------------------------------------------
      # 0.9 only: unpack the v8 library exactly as the readme says.
      # ------------------------------------------------------------------
      - name: Unpack v8_monolith (ArmorPaint 0.9)
        if: inputs.version == '0.9'
        working-directory: sources/armorpaint-09/armorcore/v8/libraries/win32/release
        run: |
          $ErrorActionPreference = "Stop"
          & 7z x -y v8_monolith.7z
          if ($LASTEXITCODE -ne 0) { throw "7z failed with exit code $LASTEXITCODE" }

      # ------------------------------------------------------------------
      # Generate the Visual Studio solution with the readme's command.
      # ------------------------------------------------------------------
      - name: Generate ArmorPaint 1.0 solution (readme ..\base\make)
        if: inputs.version == '1.0'
        working-directory: sources/armorpaint-260/paint
        run: |
          $ErrorActionPreference = "Stop"
          $diag = Join-Path $env:GITHUB_WORKSPACE "sources/armorpaint-260/build-diagnostics"
          New-Item -ItemType Directory -Force -Path $diag | Out-Null
          & cmd.exe /d /c "..\base\make.bat" 2>&1 | Tee-Object -FilePath (Join-Path $diag "generate.log") | Write-Host
          $code = $LASTEXITCODE
          if ($code -ne 0) { throw "..\base\make failed with exit code $code (see sources/armorpaint-260/build-diagnostics/generate.log)" }

      - name: Generate ArmorPaint 0.9 solution (readme ..\armorcore\Kinc\make)
        if: inputs.version == '0.9'
        working-directory: sources/armorpaint-09/armorpaint
        run: |
          $ErrorActionPreference = "Stop"
          $diag = Join-Path $env:GITHUB_WORKSPACE "sources/armorpaint-09/build-diagnostics"
          New-Item -ItemType Directory -Force -Path $diag | Out-Null
          & cmd.exe /d /c "..\armorcore\Kinc\make.bat --from ..\armorcore -g direct3d11" 2>&1 | Tee-Object -FilePath (Join-Path $diag "generate.log") | Write-Host
          $code = $LASTEXITCODE
          if ($code -ne 0) { throw "Kinc make failed with exit code $code (see sources/armorpaint-09/build-diagnostics/generate.log)" }

      # ------------------------------------------------------------------
      # Both readmes say "open build\ArmorPaint.sln, build for x64 & Release".
      # ------------------------------------------------------------------
      - name: Build solution with MSBuild (Release | x64)
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = "Stop"

          if ($env:VERSION -eq "1.0") {
            $folder = "sources/armorpaint-260"
            $project = "$folder/paint"
          }
          else {
            $folder = "sources/armorpaint-09"
            $project = "$folder/armorpaint"
          }

          $sln = Join-Path $env:GITHUB_WORKSPACE "$project/build/ArmorPaint.sln"
          if (!(Test-Path -LiteralPath $sln)) { throw "Generated solution not found: $sln" }

          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio/Installer/vswhere.exe"
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
          if (!$msbuild) { throw "MSBuild.exe was not found on this runner." }
          Write-Host "MSBuild: $msbuild"

          $diag = Join-Path $env:GITHUB_WORKSPACE "$folder/build-diagnostics"
          New-Item -ItemType Directory -Force -Path $diag | Out-Null

          & $msbuild $sln /m /p:Configuration=Release /p:Platform=x64 /nologo /v:minimal 2>&1 |
            Tee-Object -FilePath (Join-Path $diag "msbuild.log") | Write-Host
          $code = $LASTEXITCODE
          if ($code -ne 0) { throw "MSBuild failed with exit code $code (see $folder/build-diagnostics/msbuild.log)" }

      # ------------------------------------------------------------------
      # Verify the executable, stage the output and package it.
      # ------------------------------------------------------------------
      - name: Stage output and verify executable
        id: stage
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:VERSION
          $name = "ArmorPaint-$version-Windows-x64"

          if ($version -eq "1.0") {
            $folder = "sources/armorpaint-260"
            $runtimeDir = Join-Path $env:GITHUB_WORKSPACE "$folder/paint/build"
          }
          else {
            $folder = "sources/armorpaint-09"
            $buildDir = Join-Path $env:GITHUB_WORKSPACE "$folder/armorpaint/build"
            $runtimeDir = Join-Path $buildDir "krom"

            # Readme: copy build\x64\Release\ArmorPaint.exe to build\krom
            $exe = Join-Path $buildDir "x64/Release/ArmorPaint.exe"
            if (!(Test-Path -LiteralPath $exe)) { throw "Release build not found: $exe" }
            if (!(Test-Path -LiteralPath $runtimeDir)) { throw "build\krom was not created by the Kinc make step." }
            Copy-Item -LiteralPath $exe -Destination (Join-Path $runtimeDir "ArmorPaint.exe") -Force
          }

          $found = @(Get-ChildItem -LiteralPath $runtimeDir -Recurse -File -Filter "ArmorPaint.exe" -ErrorAction SilentlyContinue)
          if ($found.Count -eq 0) { throw "ArmorPaint.exe was not produced under $runtimeDir" }
          foreach ($f in $found) {
            Write-Host ("[ok] {0} ({1} MB)" -f $f.FullName, [math]::Round($f.Length / 1MB, 2))
          }

          $output = Join-Path $env:GITHUB_WORKSPACE "$folder/build-output/$name"
          $zip = Join-Path $env:GITHUB_WORKSPACE "$folder/$name.zip"
          if (Test-Path -LiteralPath $output) { Remove-Item -LiteralPath $output -Recurse -Force }
          if (Test-Path -LiteralPath $zip) { Remove-Item -LiteralPath $zip -Force }
          New-Item -ItemType Directory -Force -Path $output | Out-Null

          Copy-Item -Path (Join-Path $runtimeDir "*") -Destination $output -Recurse -Force

          # Keep what runs; drop compiler intermediates.
          Get-ChildItem -LiteralPath $output -Recurse -Directory -Force |
            Where-Object { $_.Name -in @("obj", "tlog") } |
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem -LiteralPath $output -Recurse -File |
            Where-Object { $_.Extension -in @(".obj", ".ilk", ".exp", ".lib", ".pdb", ".idb", ".ipdb", ".iobj", ".tlog") } |
            Remove-Item -Force -ErrorAction SilentlyContinue

          # GitHub rejects single files of 100 MB or more.
          $big = @(Get-ChildItem -LiteralPath $output -Recurse -File | Where-Object { $_.Length -ge 95MB })
          if ($big.Count -gt 0) {
            throw "Files too large to commit (95 MB or more): $($big.Name -join ', ')"
          }

          Compress-Archive -Path (Join-Path $output "*") -DestinationPath $zip -Force
          if ((Get-Item -LiteralPath $zip).Length -ge 95MB) {
            throw "The ZIP is 95 MB or more and cannot be committed as one file."
          }

          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value @(
            "folder=$folder",
            "artifact_name=$name",
            "output_dir=$folder/build-output/$name"
          )

      - name: Upload build output as GitHub Artifact
        if: steps.stage.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ArmorPaint-${{ inputs.version }}-Windows-x64
          path: ${{ steps.stage.outputs.output_dir }}
          if-no-files-found: error

      - name: Upload build logs as GitHub Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ArmorPaint-${{ inputs.version }}-build-logs
          path: ${{ inputs.version == '1.0' && 'sources/armorpaint-260' || 'sources/armorpaint-09' }}/build-diagnostics
          if-no-files-found: ignore

      # ------------------------------------------------------------------
      # Commit the output and logs back to this repository. Runs even after
      # a failed build so the logs are kept.
      # ------------------------------------------------------------------
      - name: Commit output and logs to repository
        if: always()
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:VERSION
          $name = "ArmorPaint-$version-Windows-x64"
          if ($version -eq "1.0") { $folder = "sources/armorpaint-260" } else { $folder = "sources/armorpaint-09" }

          $candidates = @("$folder/build-diagnostics", "$folder/build-output/$name", "$folder/$name.zip")
          $paths = @($candidates | Where-Object { Test-Path -LiteralPath $_ })
          if ($paths.Count -eq 0) {
            Write-Host "Nothing to commit."
            exit 0
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -- $paths

          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Output already matches the repository. Nothing to commit."
            exit 0
          }

          $outside = @(git diff --cached --name-only | Where-Object { $_ -notlike "$folder/*" })
          if ($outside.Count -gt 0) {
            throw "Refusing to commit files outside $folder`: $($outside -join ', ')"
          }

          git commit -q -m "Build ArmorPaint $version - Windows x64 [skip ci]" -m "Workflow run $env:GITHUB_RUN_ID"

          $branch = $env:GITHUB_REF_NAME
          $pushed = $false
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            git push origin "HEAD:$branch"
            if ($LASTEXITCODE -eq 0) { $pushed = $true; break }
            Write-Host "Push attempt $attempt failed. Rebasing onto origin/$branch and retrying."
            git fetch origin $branch
            git rebase "origin/$branch"
            if ($LASTEXITCODE -ne 0) { throw "Rebase onto origin/$branch failed. Resolve manually." }
            Start-Sleep -Seconds ($attempt * 5)
          }
          if (!$pushed) { throw "Could not push to $branch after 5 attempts." }
          Write-Host "Pushed output to $branch."

      - name: Job summary
        if: always()
        env:
          VERSION: ${{ inputs.version }}
          JOB_STATUS: ${{ job.status }}
        run: |
          $version = $env:VERSION
          $name = "ArmorPaint-$version-Windows-x64"
          if ($version -eq "1.0") { $folder = "sources/armorpaint-260" } else { $folder = "sources/armorpaint-09" }
          $repo = $env:GITHUB_REPOSITORY
          $run = $env:GITHUB_RUN_ID

          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value @(
            "## ArmorPaint $version - Windows x64",
            "",
            "| Item | Value |",
            "|---|---|",
            "| Status | $($env:JOB_STATUS) |",
            "| Build output | ``$folder/build-output/$name`` |",
            "| ZIP | ``$folder/$name.zip`` |",
            "| GitHub artifacts | $name, $name-build-logs |",
            "| Run | https://github.com/$repo/actions/runs/$run |"
          )
