name: ArmorPaint - Compile Windows Builds

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Choose which ArmorPaint version to compile"
        type: choice
        required: true
        default: "1.0"
        options:
          - "1.0"
          - "0.9"

permissions:
  contents: read

jobs:
  compile:
    name: Compile ArmorPaint ${{ inputs.version }} for Windows
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      # ---------------------------------------------------------
      # 1. CHECK OUT THE REPOSITORY
      # ---------------------------------------------------------
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ---------------------------------------------------------
      # 2. SELECT THE SOURCE DIRECTORY
      # ---------------------------------------------------------
      - name: Configure build
        id: config
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "ARMORPAINT WINDOWS BUILD"
          Write-Host "=========================================="

          switch ($env:VERSION) {
            "1.0" {
              $source = "sources/armorpaint-260"
              $buildSystem = "modern"
              $artifact = "armorpaint-1.0-windows-x64"
            }

            "0.9" {
              $source = "sources/armorpaint-09"
              $buildSystem = "legacy"
              $artifact = "armorpaint-0.9-windows-x64"
            }

            default {
              throw "Unsupported ArmorPaint version: $env:VERSION"
            }
          }

          if (!(Test-Path $source)) {
            throw "Source directory not found: $source. Run the source migration workflow first."
          }

          Write-Host "Selected version: $env:VERSION"
          Write-Host "Source directory: $source"
          Write-Host "Build system: $buildSystem"
          Write-Host "Artifact name: $artifact"

          "SOURCE_DIR=$source" >> $env:GITHUB_OUTPUT
          "BUILD_SYSTEM=$buildSystem" >> $env:GITHUB_OUTPUT
          "ARTIFACT_NAME=$artifact" >> $env:GITHUB_OUTPUT

      # ---------------------------------------------------------
      # 3. VERIFY VISUAL STUDIO BUILD TOOLS
      # ---------------------------------------------------------
      - name: Verify Windows build tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "CHECKING BUILD TOOLS"
          Write-Host "=========================================="

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          if (!(Test-Path $vswhere)) {
            throw "Visual Studio Installer and vswhere.exe were not found on the runner."
          }

          $vsPath = & $vswhere `
            -latest `
            -products "*" `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath

          if (!$vsPath) {
            throw "Visual Studio C++ x64 build tools are not installed."
          }

          Write-Host "Visual Studio installation: $vsPath"

          $msbuild = Join-Path $vsPath "MSBuild\Current\Bin\MSBuild.exe"

          if (!(Test-Path $msbuild)) {
            throw "MSBuild.exe was not found at $msbuild"
          }

          Write-Host "MSBuild found: $msbuild"

          $clang = Get-ChildItem `
            (Join-Path $vsPath "VC\Tools\Llvm\bin\clang.exe") `
            -ErrorAction SilentlyContinue

          if ($clang) {
            Write-Host "Clang found: $($clang.FullName)"
          }
          else {
            Write-Warning "Clang was not found at the standard Visual Studio LLVM path."
            Write-Warning "The build may require the Visual Studio Clang component."
          }

          "MSBUILD_PATH=$msbuild" >> $env:GITHUB_ENV

      # ---------------------------------------------------------
      # 4. INSPECT SOURCE AND DEPENDENCIES
      # ---------------------------------------------------------
      - name: Inspect source and dependencies
        shell: pwsh
        env:
          SOURCE_DIR: ${{ steps.config.outputs.SOURCE_DIR }}
          BUILD_SYSTEM: ${{ steps.config.outputs.BUILD_SYSTEM }}
        run: |
          $ErrorActionPreference = "Stop"

          $source = $env:SOURCE_DIR

          Write-Host "=========================================="
          Write-Host "SOURCE INSPECTION"
          Write-Host "=========================================="

          Write-Host "Source: $source"

          Write-Host ""
          Write-Host "Top-level files:"
          Get-ChildItem $source -Force |
            Select-Object Name, Mode |
            Format-Table -AutoSize

          Write-Host ""
          Write-Host "Searching for build files..."

          $buildFiles = @(
            Get-ChildItem $source `
              -Recurse `
              -File `
              -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Name -in @(
                "make",
                "make.bat",
                "make.exe",
                "ArmorPaint.sln",
                "CMakeLists.txt",
                "khafile.js"
              )
            }
          )

          $buildFiles |
            Select-Object -First 200 -ExpandProperty FullName

          if ($env:BUILD_SYSTEM -eq "modern") {
            if (!(Test-Path "$source/paint")) {
              throw "Modern source layout is invalid: the paint directory is missing."
            }

            if (!(Test-Path "$source/base/make")) {
              throw "Modern build script is missing: base/make"
            }

            if (!(Test-Path "$source/base/tools/bin/amake.exe") -and
                !(Test-Path "$source/base/tools/bin/amake")) {
              Write-Warning "The prebuilt amake tool was not found."
              Write-Warning "The build stage will determine whether the source can generate its project."
            }
          }

          if ($env:BUILD_SYSTEM -eq "legacy") {
            if (!(Test-Path "$source/armorcore/Kinc/make")) {
              throw "Legacy Kinc build script is missing. The selected source may not be the historical 0.9 layout."
            }

            if (!(Test-Path "$source/paint")) {
              Write-Warning "No paint directory exists at the source root."
              Write-Warning "The historical build layout must be checked before compilation."
            }

            if (!(Test-Path "$source/.gitmodules")) {
              Write-Warning "No .gitmodules file was found in the migrated source."
              Write-Warning "Check whether all required historical dependencies were included."
            }
          }

          Write-Host ""
          Write-Host "Source inspection completed."

      # ---------------------------------------------------------
      # 5. GENERATE THE MODERN WINDOWS PROJECT
      # ---------------------------------------------------------
      - name: Generate ArmorPaint 1.0 Visual Studio project
        if: inputs.version == '1.0'
        shell: pwsh
        env:
          SOURCE_DIR: ${{ steps.config.outputs.SOURCE_DIR }}
        run: |
          $ErrorActionPreference = "Stop"

          $source = (Resolve-Path $env:SOURCE_DIR).Path
          $paint = Join-Path $source "paint"
          $make = Join-Path $source "base\make"

          Write-Host "=========================================="
          Write-Host "GENERATING MODERN WINDOWS PROJECT"
          Write-Host "=========================================="

          Push-Location $paint

          try {
            Write-Host "Working directory: $paint"
            Write-Host "Build command: $make"

            # The official README documents running base/make
            # from the paint directory on Windows.
            & $make

            if ($LASTEXITCODE -ne 0) {
              throw "ArmorPaint project generation failed with exit code $LASTEXITCODE."
            }
          }
          finally {
            Pop-Location
          }

          $solution = Join-Path $paint "build\ArmorPaint.sln"

          if (!(Test-Path $solution)) {
            Write-Host "Searching for generated Visual Studio solutions..."

            Get-ChildItem $source `
              -Recurse `
              -Filter "*.sln" `
              -File `
              -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName

            throw "ArmorPaint.sln was not generated. Check the build-tool output above."
          }

          Write-Host "Generated solution: $solution"

          "SOLUTION_PATH=$solution" >> $env:GITHUB_ENV

      # ---------------------------------------------------------
      # 6. BUILD THE MODERN WINDOWS PROJECT
      # ---------------------------------------------------------
      - name: Compile ArmorPaint 1.0
        if: inputs.version == '1.0'
        shell: pwsh
        env:
          SOURCE_DIR: ${{ steps.config.outputs.SOURCE_DIR }}
        run: |
          $ErrorActionPreference = "Stop"

          $source = (Resolve-Path $env:SOURCE_DIR).Path
          $solution = $env:SOLUTION_PATH

          Write-Host "=========================================="
          Write-Host "COMPILING ARMORPAINT 1.0"
          Write-Host "=========================================="

          & $env:MSBUILD_PATH $solution `
            /m `
            /t:Build `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /verbosity:minimal

          if ($LASTEXITCODE -ne 0) {
            throw "ArmorPaint 1.0 compilation failed with exit code $LASTEXITCODE."
          }

          Write-Host "MSBuild completed successfully."

      # ---------------------------------------------------------
      # 7. BUILD THE HISTORICAL 0.9 PROJECT
      # ---------------------------------------------------------
      - name: Generate historical ArmorPaint 0.9 project
        if: inputs.version == '0.9'
        shell: pwsh
        env:
          SOURCE_DIR: ${{ steps.config.outputs.SOURCE_DIR }}
        run: |
          $ErrorActionPreference = "Stop"

          $source = (Resolve-Path $env:SOURCE_DIR).Path
          $make = Join-Path $source "armorcore\Kinc\make"

          Write-Host "=========================================="
          Write-Host "GENERATING HISTORICAL WINDOWS PROJECT"
          Write-Host "=========================================="

          if (!(Test-Path $make)) {
            throw "Historical Kinc make script was not found: $make"
          }

          # The legacy build instructions use the Direct3D 11
          # graphics backend and generate a Visual Studio solution.
          & $make --from $source\armorcore -g direct3d11

          if ($LASTEXITCODE -ne 0) {
            throw "The historical Kinc project generation failed with exit code $LASTEXITCODE."
          }

          $solution = Join-Path $source "build\ArmorPaint.sln"

          if (!(Test-Path $solution)) {
            Write-Host "Searching for generated Visual Studio solutions..."

            Get-ChildItem $source `
              -Recurse `
              -Filter "*.sln" `
              -File `
              -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName

            throw "The historical build did not generate the expected ArmorPaint.sln."
          }

          Write-Host "Generated solution: $solution"

          "SOLUTION_PATH=$solution" >> $env:GITHUB_ENV

      # ---------------------------------------------------------
      # 8. COMPILE HISTORICAL 0.9
      # ---------------------------------------------------------
      - name: Compile ArmorPaint 0.9
        if: inputs.version == '0.9'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "COMPILING ARMORPAINT 0.9"
          Write-Host "=========================================="

          & $env:MSBUILD_PATH $env:SOLUTION_PATH `
            /m `
            /t:Build `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /verbosity:minimal

          if ($LASTEXITCODE -ne 0) {
            throw "ArmorPaint 0.9 compilation failed with exit code $LASTEXITCODE."
          }

          Write-Host "Historical MSBuild compilation completed."

      # ---------------------------------------------------------
      # 9. LOCATE COMPILED EXECUTABLE
      # ---------------------------------------------------------
      - name: Locate compiled executable and runtime files
        id: output
        shell: pwsh
        env:
          SOURCE_DIR: ${{ steps.config.outputs.SOURCE_DIR }}
          VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = "Stop"

          $source = (Resolve-Path $env:SOURCE_DIR).Path

          Write-Host "=========================================="
          Write-Host "LOCATING BUILD OUTPUT"
          Write-Host "=========================================="

          $candidates = @(
            Get-ChildItem $source `
              -Recurse `
              -Filter "ArmorPaint.exe" `
              -File `
              -ErrorAction SilentlyContinue |
            Where-Object {
              $_.FullName -notmatch '[\\/](Debug|obj)[\\/]'
            }
          )

          if ($candidates.Count -eq 0) {
            Write-Host "No ArmorPaint.exe was found."
            Write-Host "Recent executable files:"
            Get-ChildItem $source `
              -Recurse `
              -Filter "*.exe" `
              -File `
              -ErrorAction SilentlyContinue |
              Select-Object -First 100 -ExpandProperty FullName

            throw "Compilation finished without a discoverable ArmorPaint.exe."
          }

          $exe = $candidates |
            Sort-Object {
              if ($_.FullName -match '[\\/]Release[\\/]') { 0 } else { 1 }
            } |
            Select-Object -First 1

          Write-Host "Executable found: $($exe.FullName)"

          $output = Join-Path $env:GITHUB_WORKSPACE "build-output\ArmorPaint-$env:VERSION"

          New-Item -ItemType Directory -Force -Path $output | Out-Null

          # Copy the executable.
          Copy-Item $exe.FullName (Join-Path $output "ArmorPaint.exe") -Force

          # Copy generated runtime/data directories when present.
          $possibleDataDirectories = @(
            (Join-Path $source "paint\build\krom"),
            (Join-Path $source "paint\build\out"),
            (Join-Path $source "build\krom"),
            (Join-Path $source "build\out"),
            (Join-Path $source "armorcore\Deployment")
          )

          foreach ($directory in $possibleDataDirectories) {
            if (Test-Path $directory) {
              $name = Split-Path $directory -Leaf
              $destination = Join-Path $output $name

              Write-Host "Copying runtime directory: $directory"

              Copy-Item $directory $destination -Recurse -Force
            }
          }

          Write-Host ""
          Write-Host "Prepared output:"
          Get-ChildItem $output -Recurse |
            Select-Object FullName, Length |
            Format-Table -AutoSize

          "OUTPUT_DIR=$output" >> $env:GITHUB_OUTPUT

      # ---------------------------------------------------------
      # 10. PACKAGE WINDOWS BUILD
      # ---------------------------------------------------------
      - name: Package Windows build
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
          OUTPUT_DIR: ${{ steps.output.outputs.OUTPUT_DIR }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "PACKAGING WINDOWS BUILD"
          Write-Host "=========================================="

          $archive = Join-Path `
            $env:GITHUB_WORKSPACE `
            "ArmorPaint-$env:VERSION-Windows-x64.zip"

          if (Test-Path $archive) {
            Remove-Item $archive -Force
          }

          Compress-Archive `
            -Path "$env:OUTPUT_DIR\*" `
            -DestinationPath $archive `
            -CompressionLevel Optimal

          if (!(Test-Path $archive)) {
            throw "The Windows build archive was not created."
          }

          $item = Get-Item $archive

          Write-Host "Archive: $($item.FullName)"
          Write-Host ("Size: {0:N2} MB" -f ($item.Length / 1MB))

      # ---------------------------------------------------------
      # 11. UPLOAD BUILD ARTIFACT
      # ---------------------------------------------------------
      - name: Upload compiled Windows build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.config.outputs.ARTIFACT_NAME }}
          path: ArmorPaint-${{ inputs.version }}-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      # ---------------------------------------------------------
      # 12. FINAL SUMMARY
      # ---------------------------------------------------------
      - name: Build summary
        if: always()
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_DIR: ${{ steps.config.outputs.SOURCE_DIR }}
          BUILD_SYSTEM: ${{ steps.config.outputs.BUILD_SYSTEM }}
          ARTIFACT_NAME: ${{ steps.config.outputs.ARTIFACT_NAME }}
        run: |
          Write-Host ""
          Write-Host "=========================================="
          Write-Host "ARMORPAINT BUILD SUMMARY"
          Write-Host "=========================================="

          Write-Host "Version: $env:VERSION"
          Write-Host "Source: $env:SOURCE_DIR"
          Write-Host "Build system: $env:BUILD_SYSTEM"
          Write-Host "Artifact: $env:ARTIFACT_NAME"
          Write-Host "Run ID: $env:GITHUB_RUN_ID"
          Write-Host ""
          Write-Host "Review earlier stages if the build failed."
