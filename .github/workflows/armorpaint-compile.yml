name: ArmorPaint - Compile for Windows x64

on:
  workflow_dispatch:
    inputs:
      version:
        description: "ArmorPaint version to compile"
        type: choice
        required: true
        default: "1.0"
        options:
          - "1.0"
          - "0.9"
      source_folder:
        description: "Optional override path (leave empty for defaults)"
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: armorpaint-compile-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  compile:
    name: ArmorPaint ${{ inputs.version }} - Windows x64
    runs-on: windows-latest
    timeout-minutes: 180

    defaults:
      run:
        shell: pwsh

    env:
      VERSION: ${{ inputs.version }}
      CUSTOM_FOLDER: ${{ inputs.source_folder }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Determine source folder
        id: source
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:VERSION
          $custom  = $env:CUSTOM_FOLDER

          if ($custom) {
            $source = $custom.Trim()
            Write-Host "Using custom source folder: $source"
          }
          else {
            if ($version -eq "1.0") {
              $source = "sources/armorpaint-260/paint"
            }
            else {
              $source = "sources/armorpaint-09/armorpaint"
            }
            Write-Host "Using default source folder for $version : $source"
          }

          $sourcePath = Join-Path $env:GITHUB_WORKSPACE $source
          if (!(Test-Path -LiteralPath $sourcePath)) {
            throw "Source folder not found: $sourcePath"
          }

          "folder=$source" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Enable long paths
        run: |
          $ErrorActionPreference = "Stop"
          git config --global core.longpaths true
          try {
            Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name LongPathsEnabled -Value 1 -Type DWord
            Write-Host "Windows long paths enabled."
          }
          catch {
            Write-Host "Could not enable long paths (continuing)"
          }

      # ------------------------------------------------------------------
      # 1.0 – Official style
      # ------------------------------------------------------------------
      - name: "[1.0] Compile"
        if: env.VERSION == '1.0'
        env:
          SOURCE: ${{ steps.source.outputs.folder }}
        working-directory: \( {{ github.workspace }}/ \){{ env.SOURCE }}
        run: |
          $ErrorActionPreference = "Stop"
          $diag = Join-Path (Split-Path -Parent (Split-Path -Parent $PWD)) "build-diagnostics"
          New-Item -ItemType Directory -Force -Path $diag | Out-Null

          Write-Host "=== [1.0] Running: ../base/make --compile ==="
          & cmd.exe /d /c "..\base\make --compile" 2>&1 |
            Tee-Object -FilePath (Join-Path $diag "generate.log") |
            Write-Host

          if ($LASTEXITCODE -ne 0) {
            throw "1.0 make --compile failed. See build-diagnostics/generate.log"
          }
          Write-Host "[ok] 1.0 compile finished"

      # ------------------------------------------------------------------
      # 0.9 – disabled until v8_monolith.7z is present
      # ------------------------------------------------------------------
      - name: "[0.9] Not available"
        if: env.VERSION == '0.9'
        run: |
          Write-Host "::error::0.9 build is currently disabled because v8_monolith.7z is missing."
          Write-Host "Please switch to version 1.0 or add the missing file."
          exit 1

      # ------------------------------------------------------------------
      # Stage output
      # ------------------------------------------------------------------
      - name: Stage output and verify executable
        id: stage
        if: env.VERSION == '1.0'
        env:
          SOURCE: ${{ steps.source.outputs.folder }}
        run: |
          $ErrorActionPreference = "Stop"
          $version    = $env:VERSION
          $source     = $env:SOURCE
          $sourcePath = Join-Path $env:GITHUB_WORKSPACE $source
          $name       = "ArmorPaint-$version-Windows-x64"

          $runtimeDir = Join-Path $sourcePath "build"

          $found = @(Get-ChildItem -LiteralPath $runtimeDir -Recurse -File -Filter "ArmorPaint.exe" -ErrorAction SilentlyContinue)
          if ($found.Count -eq 0) {
            $found = @(Get-ChildItem -LiteralPath $sourcePath -Recurse -File -Filter "ArmorPaint.exe" -ErrorAction SilentlyContinue)
          }

          if ($found.Count -eq 0) {
            throw "ArmorPaint.exe was not found after compile"
          }

          foreach ($f in $found) {
            Write-Host ("[ok] Found: {0} ({1} MB)" -f $f.FullName, [math]::Round($f.Length / 1MB, 2))
          }

          $runtimeDir = $found[0].DirectoryName
          $baseDir    = Split-Path -Parent $sourcePath
          $output     = Join-Path $baseDir "build-output\$name"
          $zip        = Join-Path $baseDir "$name.zip"

          if (Test-Path -LiteralPath $output) { Remove-Item -LiteralPath $output -Recurse -Force }
          if (Test-Path -LiteralPath $zip)    { Remove-Item -LiteralPath $zip -Force }
          New-Item -ItemType Directory -Force -Path $output | Out-Null

          Copy-Item -Path (Join-Path $runtimeDir "*") -Destination $output -Recurse -Force

          # Clean intermediate files
          Get-ChildItem -LiteralPath $output -Recurse -Directory -Force |
            Where-Object { $_.Name -in @("obj", "tlog") } |
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue

          Get-ChildItem -LiteralPath $output -Recurse -File |
            Where-Object { $_.Extension -in @(".obj", ".ilk", ".exp", ".lib", ".pdb", ".idb", ".ipdb", ".iobj", ".tlog") } |
            Remove-Item -Force -ErrorAction SilentlyContinue

          $big = @(Get-ChildItem -LiteralPath $output -Recurse -File | Where-Object { $_.Length -ge 95MB })
          if ($big.Count -gt 0) {
            throw "Files too large (≥ 95 MB): $($big.Name -join ', ')"
          }

          Compress-Archive -Path (Join-Path $output "*") -DestinationPath $zip -Force
          if ((Get-Item -LiteralPath $zip).Length -ge 95MB) {
            throw "ZIP is ≥ 95 MB"
          }

          Write-Host "[ok] Staged: $output"
          Write-Host "[ok] ZIP: $zip"

          @"
          base_dir=$baseDir
          artifact_name=$name
          output_dir=$output
          "@ | Out-File -
