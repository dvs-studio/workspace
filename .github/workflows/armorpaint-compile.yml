name: ArmorPaint - Compile for Windows x64

on:
  workflow_dispatch:
    inputs:
      version:
        description: "ArmorPaint version to compile"
        type: choice
        required: true
        default: "1.0"
        options:
          - "1.0"
          - "0.9"
      source_folder:
        description: "Optional override path (leave empty for defaults)"
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: armorpaint-compile-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  compile:
    name: ArmorPaint ${{ inputs.version }} - Windows x64
    runs-on: windows-latest
    timeout-minutes: 180

    defaults:
      run:
        shell: pwsh

    env:
      VERSION: ${{ inputs.version }}
      CUSTOM_FOLDER: ${{ inputs.source_folder }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive          # needed for 0.9

      - name: Determine source folder
        id: source
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:VERSION
          $custom  = $env:CUSTOM_FOLDER

          if ($custom) {
            $source = $custom.Trim()
            Write-Host "Using custom source folder: $source"
          }
          else {
            if ($version -eq "1.0") {
              $source = "sources/armorpaint-260/paint"
            }
            else {
              $source = "sources/armorpaint-09/armorpaint"
            }
            Write-Host "Using default source folder for $version : $source"
          }

          $sourcePath = Join-Path $env:GITHUB_WORKSPACE $source
          if (!(Test-Path -LiteralPath $sourcePath)) {
            throw "Source folder not found: $sourcePath"
          }

          "folder=$source" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Enable long paths
        run: |
          $ErrorActionPreference = "Stop"
          git config --global core.longpaths true
          try {
            Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
                             -Name LongPathsEnabled -Value 1 -Type DWord
            Write-Host "Windows long paths enabled."
          }
          catch {
            Write-Host "Could not enable long paths (continuing)"
          }

      # ------------------------------------------------------------------
      # 1.0 – Official style: ../base/make --compile
      # ------------------------------------------------------------------
      - name: "[1.0] Compile (../base/make --compile)"
        if: env.VERSION == '1.0'
        env:
          SOURCE: ${{ steps.source.outputs.folder }}
        working-directory: \( {{ github.workspace }}/ \){{ env.SOURCE }}
        run: |
          $ErrorActionPreference = "Stop"
          $diag = Join-Path (Split-Path -Parent (Split-Path -Parent $PWD)) "build-diagnostics"
          New-Item -ItemType Directory -Force -Path $diag | Out-Null

          Write-Host "=== [1.0] Running: ../base/make --compile ==="
          & cmd.exe /d /c "..\base\make --compile" 2>&1 |
            Tee-Object -FilePath (Join-Path $diag "generate.log") |
            Write-Host

          if ($LASTEXITCODE -ne 0) {
            throw "1.0 make --compile failed. See build-diagnostics/generate.log"
          }
          Write-Host "[ok] 1.0 compile finished"

      # ------------------------------------------------------------------
      # 0.9 – Official style (Direct3D11)
      # ------------------------------------------------------------------
      - name: "[0.9] Unpack v8_monolith.7z"
        if: env.VERSION == '0.9'
        env:
          SOURCE: ${{ steps.source.outputs.folder }}
        uses: DuckSoft/extract-7z-action@v1.0
        with:
          pathSource: \( {{ github.workspace }}/ \){{ env.SOURCE }}/../armorcore/v8/libraries/win32/release/v8_monolith.7z
          pathTarget: \( {{ github.workspace }}/ \){{ env.SOURCE }}/../armorcore/v8/libraries/win32/release/

      - name: "[0.9] Compile (Kinc/make -g direct3d11 --compile)"
        if: env.VERSION == '0.9'
        env:
          SOURCE: ${{ steps.source.outputs.folder }}
        working-directory: \( {{ github.workspace }}/ \){{ env.SOURCE }}/../armorcore
        run: |
          $ErrorActionPreference = "Stop"
          $diag = Join-Path (Split-Path -Parent $PWD) "build-diagnostics"
          New-Item -ItemType Directory -Force -Path $diag | Out-Null

          Write-Host "=== [0.9] Running: Kinc/make -g direct3d11 --compile ==="
          & cmd.exe /d /c "Kinc\make -g direct3d11 --compile" 2>&1 |
            Tee-Object -FilePath (Join-Path $diag "generate.log") |
            Write-Host

          if ($LASTEXITCODE -ne 0) {
            throw "0.9 Kinc make --compile failed. See build-diagnostics/generate.log"
          }
          Write-Host "[ok] 0.9 compile finished"

      # ------------------------------------------------------------------
      # Stage output (same for both)
      # ------------------------------------------------------------------
      - name: Stage output and verify executable
        id: stage
        env:
          SOURCE: ${{ steps.source.outputs.folder }}
        run: |
          $ErrorActionPreference = "Stop"
          $version    = $env:VERSION
          $source     = $env:SOURCE
          $sourcePath = Join-Path $env:GITHUB_WORKSPACE $source
          $name       = "ArmorPaint-$version-Windows-x64"

          if ($version -eq "1.0") {
            # 1.0 normally puts the exe under build/
            $runtimeDir = Join-Path $sourcePath "build"
          }
          else {
            # 0.9 with --compile usually ends up in build/krom or build/x64/Release
            $buildDir   = Join-Path $sourcePath "build"
            $runtimeDir = Join-Path $buildDir "krom"

            # Fallback: also look in the classic MSBuild output location
            $exeClassic = Join-Path $buildDir "x64\Release\ArmorPaint.exe"
            if (Test-Path -LiteralPath $exeClassic) {
              if (!(Test-Path -LiteralPath $runtimeDir)) {
                New-Item -ItemType Directory -Force -Path $runtimeDir | Out-Null
              }
              Copy-Item -LiteralPath $exeClassic -Destination (Join-Path $runtimeDir "ArmorPaint.exe") -Force
            }
          }

          $found = @(Get-ChildItem -LiteralPath $runtimeDir -Recurse -File -Filter "ArmorPaint.exe" -ErrorAction SilentlyContinue)
          if ($found.Count -eq 0) {
            # Last-chance search
            $found = @(Get-ChildItem -LiteralPath $sourcePath -Recurse -File -Filter "ArmorPaint.exe" -ErrorAction SilentlyContinue)
          }

          if ($found.Count -eq 0) {
            throw "ArmorPaint.exe was not found after compile"
          }

          foreach ($f in $found) {
            Write-Host ("[ok] Found: {0} ({1} MB)" -f $f.FullName, [math]::Round($f.Length / 1MB, 2))
          }

          # Use the directory of the first found exe as runtime
          $runtimeDir = $found[0].DirectoryName

          $baseDir = Split-Path -Parent $sourcePath
          $output  = Join-Path $baseDir "build-output\$name"
          $zip     = Join-Path $baseDir "$name.zip"

          if (Test-Path -LiteralPath $output) { Remove-Item -LiteralPath $output -Recurse -Force }
          if (Test-Path -LiteralPath $zip)    { Remove-Item -LiteralPath $zip -Force }
          New-Item -ItemType Directory -Force -Path $output | Out-Null

          # Copy everything from the runtime folder
          Copy-Item -Path (Join-Path $runtimeDir "*") -Destination $output -Recurse -Force

          # Clean intermediate files
          Get-ChildItem -LiteralPath $output -Recurse -Directory -Force |
            Where-Object { $_.Name -in @("obj", "tlog") } |
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue

          Get-ChildItem -LiteralPath $output -Recurse -File |
            Where-Object { $_.Extension -in @(".obj", ".ilk", ".exp", ".lib", ".pdb", ".idb", ".ipdb", ".iobj", ".tlog") } |
            Remove-Item -Force -ErrorAction SilentlyContinue

          $big = @(Get-ChildItem -LiteralPath $output -Recurse -File | Where-Object { $_.Length -ge 95MB })
          if ($big.Count -gt 0) {
            throw "Files too large (≥ 95 MB): $($big.Name -join ', ')"
          }

          Compress-Archive -Path (Join-Path $output "*") -DestinationPath $zip -Force
          if ((Get-Item -LiteralPath $zip).Length -ge 95MB) {
            throw "ZIP is ≥ 95 MB"
          }

          Write-Host "[ok] Staged: $output"
          Write-Host "[ok] ZIP: $zip"

          @"
          base_dir=$baseDir
          artifact_name=$name
          output_dir=$output
          "@ | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload build output
        if: steps.stage.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ArmorPaint-${{ inputs.version }}-Windows-x64
          path: ${{ steps.stage.outputs.output_dir }}
          if-no-files-found: error

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ArmorPaint-${{ inputs.version }}-build-logs
          path: ${{ steps.stage.outputs.base_dir }}/build-diagnostics
          if-no-files-found: ignore

      - name: Commit output and logs
        if: always()
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:VERSION
          \( baseDir = " \){{ steps.stage.outputs.base
