name: Compile ArmorPaint for Windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Select ArmorPaint version to compile"
        required: true
        type: choice
        options:
          - "1.0"
          - "0.9"

permissions:
  contents: read

jobs:
  compile:
    name: Compile ArmorPaint ${{ inputs.version }} - Windows x64
    runs-on: windows-latest
    timeout-minutes: 120

    env:
      VERSION: ${{ inputs.version }}

    steps:
      - name: Checkout workspace repository
        uses: actions/checkout@v4

      - name: Select source directory
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if ("${{ inputs.version }}" -eq "1.0") {
            $source = Join-Path $env:GITHUB_WORKSPACE "sources/armorpaint-260"
          }
          else {
            $source = Join-Path $env:GITHUB_WORKSPACE "sources/armorpaint-09"
          }

          if (!(Test-Path -LiteralPath $source -PathType Container)) {
            throw "Source directory does not exist: $source"
          }

          "SOURCE=$source" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "Selected version: $env:VERSION"
          Write-Host "Source directory: $source"

          Write-Host ""
          Write-Host "Top-level source contents:"

          Get-ChildItem -LiteralPath $source |
            Select-Object Mode, Name |
            Format-Table -AutoSize

          Write-Host ""
          Write-Host "Build-related files:"

          Get-ChildItem -LiteralPath $source `
            -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Name -in @(
                "README.md",
                "readme.md",
                "khafile.js",
                "make",
                "make.bat",
                "make.cmd",
                "make.ps1",
                "make.js",
                "ArmorPaint.sln",
                "ArmorPaint.slnx"
              )
            } |
            Select-Object -First 200 -ExpandProperty FullName

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Verify Visual Studio build tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $vswhere = Join-Path `
            ${env:ProgramFiles(x86)} `
            "Microsoft Visual Studio/Installer/vswhere.exe"

          if (!(Test-Path -LiteralPath $vswhere)) {
            throw "Visual Studio Installer / vswhere was not found."
          }

          $vsPath = & $vswhere `
            -latest `
            -products "*" `
            -property installationPath

          if (!$vsPath) {
            throw "No Visual Studio installation was detected."
          }

          Write-Host "Visual Studio: $vsPath"

          $msbuild = Join-Path $vsPath `
            "MSBuild/Current/Bin/MSBuild.exe"

          if (!(Test-Path -LiteralPath $msbuild)) {
            throw "MSBuild.exe was not found: $msbuild"
          }

          "MSBUILD=$msbuild" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host ""
          Write-Host "MSBuild version:"
          & $msbuild -version -nologo

          Write-Host ""
          Write-Host "Node version:"
          node --version

          Write-Host ""
          Write-Host "npm version:"
          npm --version

      - name: Inspect source README files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          $readmes = @(
            (Join-Path $env:SOURCE "README.md"),
            (Join-Path $env:SOURCE "readme.md"),
            (Join-Path $env:SOURCE "armorpaint/README.md"),
            (Join-Path $env:SOURCE "armorpaint/readme.md"),
            (Join-Path $env:SOURCE "paint/README.md"),
            (Join-Path $env:SOURCE "paint/readme.md")
          )

          foreach ($file in ($readmes | Select-Object -Unique)) {
            if (Test-Path -LiteralPath $file -PathType Leaf) {
              Write-Host ""
              Write-Host "=========================================="
              Write-Host "README: $file"
              Write-Host "=========================================="

              Get-Content -LiteralPath $file |
                Select-Object -First 250
            }
          }

      - name: Generate ArmorPaint 1.0 project
        if: inputs.version == '1.0'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "GENERATING ARMORPAINT 1.0 PROJECT"
          Write-Host "=========================================="

          $source = $env:SOURCE
          $paint = Join-Path $source "paint"
          $base = Join-Path $source "base"
          $make = Join-Path $base "make"
          $logDir = Join-Path $env:GITHUB_WORKSPACE "build-logs"

          New-Item -ItemType Directory -Path $logDir -Force |
            Out-Null

          if (!(Test-Path -LiteralPath $paint -PathType Container)) {
            throw "Modern paint directory is missing: $paint"
          }

          if (!(Test-Path -LiteralPath $base -PathType Container)) {
            throw "Modern base directory is missing: $base"
          }

          if (!(Test-Path -LiteralPath $make -PathType Leaf)) {
            Write-Host "Files found in base:"

            Get-ChildItem -LiteralPath $base |
              Select-Object Name, Mode |
              Format-Table -AutoSize

            throw "Build entry point is missing: $make"
          }

          $log = Join-Path $logDir "armorpaint-1.0-generation.log"

          $solutionSln = Join-Path $paint "build/ArmorPaint.sln"
          $solutionSlnx = Join-Path $paint "build/ArmorPaint.slnx"

          Push-Location $paint

          try {
            Write-Host "Working directory: $paint"
            Write-Host "Build command: $make"

            $global:LASTEXITCODE = 0

            & $make *> $log

            $commandSucceeded = $?
            $nativeExitCode = $LASTEXITCODE

            Write-Host ""
            Write-Host "========== GENERATION LOG =========="

            if (Test-Path -LiteralPath $log) {
              Get-Content -LiteralPath $log
            }

            Write-Host "===================================="

            if (Test-Path -LiteralPath $solutionSln -PathType Leaf) {
              $solution = $solutionSln
            }
            elseif (Test-Path -LiteralPath $solutionSlnx -PathType Leaf) {
              $solution = $solutionSlnx
            }
            else {
              Write-Host ""
              Write-Host "Neither ArmorPaint.sln nor ArmorPaint.slnx was generated."

              Get-ChildItem -LiteralPath $source `
                -Recurse -File -ErrorAction SilentlyContinue |
                Where-Object {
                  $_.Extension -in @(".sln", ".slnx")
                } |
                Select-Object -ExpandProperty FullName

              if ($null -ne $nativeExitCode -and $nativeExitCode -ne 0) {
                throw "Project generation returned exit code $nativeExitCode. See $log"
              }

              if (!$commandSucceeded) {
                throw "Project generation failed. See $log"
              }

              throw "No generated solution was found. See $log"
            }

            Write-Host ""
            Write-Host "Selected solution: $solution"

            "SOLUTION=$solution" |
              Out-File $env:GITHUB_ENV -Append -Encoding utf8
          }
          finally {
            Pop-Location
          }

      - name: Generate ArmorPaint 0.9 project
        if: inputs.version == '0.9'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "DETECTING ARMORPAINT 0.9 BUILD SYSTEM"
          Write-Host "=========================================="

          $source = $env:SOURCE
          $logDir = Join-Path $env:GITHUB_WORKSPACE "build-logs"

          New-Item -ItemType Directory -Path $logDir -Force |
            Out-Null

          $appDir = Join-Path $source "armorpaint"
          $appKhaFile = Join-Path $appDir "khafile.js"

          $legacyMake = Join-Path $source "armorcore/Kinc/make"
          $legacyMakeBat = Join-Path $source "armorcore/Kinc/make.bat"

          $khaMakeJs = Join-Path $source "Kha/make.js"
          $khaMake = Join-Path $source "Kha/make"

          $log = Join-Path $logDir "armorpaint-0.9-generation.log"

          if (!(Test-Path -LiteralPath $appKhaFile -PathType Leaf)) {
            Write-Host "Available Kha project files:"

            Get-ChildItem -LiteralPath $source `
              -Recurse -Filter "khafile.js" `
              -File -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName

            throw "Expected project file is missing: $appKhaFile"
          }

          Write-Host "Application directory: $appDir"
          Write-Host "Application project: $appKhaFile"

          $commandSucceeded = $false
          $nativeExitCode = $null

          if (Test-Path -LiteralPath $legacyMakeBat -PathType Leaf) {
            Push-Location $source

            try {
              & $legacyMakeBat `
                --from (Join-Path $source "armorcore") `
                -g direct3d11 *> $log

              $commandSucceeded = $?
              $nativeExitCode = $LASTEXITCODE
            }
            finally {
              Pop-Location
            }
          }
          elseif (Test-Path -LiteralPath $legacyMake -PathType Leaf) {
            Push-Location $source

            try {
              & $legacyMake `
                --from (Join-Path $source "armorcore") `
                -g direct3d11 *> $log

              $commandSucceeded = $?
              $nativeExitCode = $LASTEXITCODE
            }
            finally {
              Pop-Location
            }
          }
          elseif (Test-Path -LiteralPath $khaMakeJs -PathType Leaf) {
            Push-Location $appDir

            try {
              node $khaMakeJs krom -g direct3d11 *> $log

              $commandSucceeded = $?
              $nativeExitCode = $LASTEXITCODE
            }
            finally {
              Pop-Location
            }
          }
          elseif (Test-Path -LiteralPath $khaMake -PathType Leaf) {
            Push-Location $appDir

            try {
              & $khaMake krom -g direct3d11 *> $log

              $commandSucceeded = $?
              $nativeExitCode = $LASTEXITCODE
            }
            finally {
              Pop-Location
            }
          }
          else {
            Write-Host "No recognized legacy Kinc or Kha build entry point was found."

            Get-ChildItem -LiteralPath $source `
              -Recurse -File -ErrorAction SilentlyContinue |
              Where-Object {
                $_.Name -match "^(make|make\.bat|make\.cmd|make\.ps1|make\.js|package\.json|khafile\.js)$"
              } |
              Select-Object -First 200 -ExpandProperty FullName

            throw "Cannot safely choose the 0.9 build command. Required build tools may be absent."
          }

          Write-Host ""
          Write-Host "========== GENERATION LOG =========="

          if (Test-Path -LiteralPath $log) {
            Get-Content -LiteralPath $log
          }

          Write-Host "===================================="

          $solutionSln = Join-Path $source "build/ArmorPaint.sln"
          $solutionSlnx = Join-Path $source "build/ArmorPaint.slnx"

          if (Test-Path -LiteralPath $solutionSln -PathType Leaf) {
            $solution = $solutionSln
          }
          elseif (Test-Path -LiteralPath $solutionSlnx -PathType Leaf) {
            $solution = $solutionSlnx
          }
          else {
            $solutions = @(
              Get-ChildItem -LiteralPath $source `
                -Recurse -File -ErrorAction SilentlyContinue |
              Where-Object {
                $_.Extension -in @(".sln", ".slnx")
              }
            )

            if ($solutions.Count -gt 0) {
              $solutions |
                Select-Object -ExpandProperty FullName
            }

            if ($null -ne $nativeExitCode -and $nativeExitCode -ne 0) {
              throw "ArmorPaint 0.9 generation failed with exit code $nativeExitCode. See $log"
            }

            if (!$commandSucceeded) {
              throw "ArmorPaint 0.9 generation failed. See $log"
            }

            throw "No .sln or .slnx solution was generated. See $log"
          }

          Write-Host "Selected solution: $solution"

          "SOLUTION=$solution" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Select generated Visual Studio solution
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # Prefer the solution already selected during generation.
          if ($env:SOLUTION -and
              (Test-Path -LiteralPath $env:SOLUTION -PathType Leaf)) {
            Write-Host "Using generated solution: $env:SOLUTION"
            exit 0
          }

          if ("${{ inputs.version }}" -eq "1.0") {
            $buildDirectory = Join-Path $env:SOURCE "paint/build"
          }
          else {
            $buildDirectory = Join-Path $env:SOURCE "build"
          }

          $preferredSln = Join-Path $buildDirectory "ArmorPaint.sln"
          $preferredSlnx = Join-Path $buildDirectory "ArmorPaint.slnx"

          if (Test-Path -LiteralPath $preferredSln -PathType Leaf) {
            $solution = $preferredSln
          }
          elseif (Test-Path -LiteralPath $preferredSlnx -PathType Leaf) {
            $solution = $preferredSlnx
          }
          else {
            $solutions = @(
              Get-ChildItem -LiteralPath $env:SOURCE `
                -Recurse -File -ErrorAction SilentlyContinue |
              Where-Object {
                $_.Extension -in @(".sln", ".slnx")
              }
            )

            if ($solutions.Count -eq 0
