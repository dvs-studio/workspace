name: ArmorPaint - Compile for Windows x64

# Builds ArmorPaint 1.0 or 0.9 for Windows x64 with the Windows steps from each
# version's own readme. Only the ArmorPaint folders are used; the rest of the
# ArmorTools suite is never built.
#
#   ArmorPaint 1.0   folder   sources/armorpaint-260/paint
#       readme       sources/armorpaint-260/readme.md
#       steps        ..\base\make.bat                 -> build\ArmorPaint.sln
#                    MSBuild build\ArmorPaint.sln     Release | x64
#
#   ArmorPaint 0.9   folder   sources/armorpaint-09/armorpaint
#       readme       sources/armorpaint-09/armorpaint/README.md
#       steps        7z x v8_monolith.7z              (armorcore\v8\libraries\win32\release)
#                    ..\armorcore\Kinc\make --from ..\armorcore -g direct3d11
#                    MSBuild build\ArmorPaint.sln     Release | x64
#                    copy build\x64\Release\ArmorPaint.exe to build\krom
#
# Output, committed to the repository and uploaded as a GitHub artifact:
#   sources/<folder>/build-output/ArmorPaint-<v>-Windows-x64/
#   sources/<folder>/ArmorPaint-<v>-Windows-x64.zip
# Logs, committed but not packaged:
#   sources/<folder>/build-diagnostics/

on:
  workflow_dispatch:
    inputs:
      version:
        description: "ArmorPaint version to compile"
        type: choice
        required: true
        default: "1.0"
        options:
          - "1.0"
          - "0.9"
      source_folder:
        description: "Path to source folder (e.g., sources/armorpaint-260/paint for 1.0, sources/armorpaint-09/armorpaint for 0.9). Leave blank for defaults."
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: armorpaint-compile-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  compile:
    name: ArmorPaint ${{ inputs.version }} - Windows x64
    runs-on: windows-latest
    timeout-minutes: 180

    defaults:
      run:
        shell: pwsh

    env:
      VERSION: ${{ inputs.version }}
      CUSTOM_FOLDER: ${{ inputs.source_folder }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Determine source folder
        id: source
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:VERSION
          $custom = $env:CUSTOM_FOLDER

          if ($custom) {
            $source = $custom
            Write-Host "Using custom source folder: $source"
          }
          else {
            if ($version -eq "1.0") {
              $source = "sources/armorpaint-260/paint"
            }
            else {
              $source = "sources/armorpaint-09/armorpaint"
            }
            Write-Host "Using default source folder for $version : $source"
          }

          $sourcePath = Join-Path $env:GITHUB_WORKSPACE $source
          if (!(Test-Path -LiteralPath $sourcePath)) {
            throw "Source folder not found: $sourcePath"
          }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "folder=$source"

      - name: Enable long paths
        run: |
          $ErrorActionPreference = "Stop"
          git config --global core.longpaths true
          try {
            Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name LongPathsEnabled -Value 1 -Type DWord
            Write-Host "Windows long paths enabled."
          }
          catch {
            Write-Host "Could not enable Windows long paths (continuing): $($_.Exception.Message)"
          }

      - name: Check source folder structure
        env:
          SOURCE: ${{ steps.source.outputs.folder }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:VERSION
          $source = $env:SOURCE
          $sourcePath = Join-Path $env:GITHUB_WORKSPACE $source

          Write-Host "Checking source at: $sourcePath"

          if ($version -eq "1.0") {
            $required = @(
              "readme.md",
              "project.js",
              "../base/make.bat",
              "../base/tools/bin/windows_x64/amake.exe"
            )
          }
          else {
            $required = @(
              "README.md",
              "khafile.js",
              "../armorcore/make.js",
              "../armorcore/Kinc/make.bat",
              "../armorcore/v8/libraries/win32/release/v8_monolith.7z"
            )
          }

          $missing = @()
          foreach ($rel in $required) {
            $full = Join-Path $sourcePath $rel
            if (Test-Path -LiteralPath $full) {
              Write-Host "[ok]      $rel"
            }
            else {
              Write-Host "[MISSING] $rel"
              $missing += $rel
            }
          }

          if ($missing.Count -gt 0) {
            throw "Source incomplete. Missing: $($missing -join ', ')"
          }

      # ============================================================================
      # 1.0 GENERATE SOLUTION
      # ============================================================================
      # EDIT THIS SECTION to customize 1.0 make command
      # Starts: Line ~155 | Ends: Line ~180
      # Current command: ..\base\make.bat
      # Modify the & cmd.exe line to change build parameters
      # ============================================================================
      - name: "[1.0] Generate solution (..\base\make.bat)"
        if: env.VERSION == '1.0'
        env:
          SOURCE: ${{ steps.source.outputs.folder }}
        working-directory: ${{ env.GITHUB_WORKSPACE }}\${{ env.SOURCE }}
        run: |
          $ErrorActionPreference = "Stop"
          $diag = Join-Path (Split-Path -Parent (Split-Path -Parent $PWD)) "build-diagnostics"
          New-Item -ItemType Directory -Force -Path $diag | Out-Null

          Write-Host "=== [1.0] Generating solution from: ..\base\make.bat ==="
          & cmd.exe /d /c "..\base\make.bat" 2>&1 | Tee-Object -FilePath (Join-Path $diag "generate.log") | Write-Host

          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Write-Host "::error::make.bat failed with exit code $code"
            throw "See build-diagnostics/generate.log for details"
          }
          Write-Host "[ok] Solution generated"

      # ============================================================================
      # 0.9 STEP 1: UNPACK V8 LIBRARY
      # ============================================================================
      # EDIT THIS SECTION to customize 0.9 v8 unpacking
      # Starts: Line ~185 | Ends: Line ~210
      # Current command: & 7z x -y v8_monolith.7z
      # Modify to change extraction options or location
      # ============================================================================
      - name: "[0.9] Step 1: Unpack v8_monolith.7z"
        if: env.VERSION == '0.9'
        env:
          SOURCE: ${{ steps.source.outputs.folder }}
        run: |
          $ErrorActionPreference = "Stop"
          $source = $env:SOURCE
          $v8Dir = Join-Path $env:GITHUB_WORKSPACE "$source/../armorcore/v8/libraries/win32/release"

          Write-Host "=== [0.9] Step 1: Unpacking v8_monolith.7z ==="
          Write-Host "Location: $v8Dir"
          Push-Location $v8Dir
          try {
            & 7z x -y v8_monolith.7z
            if ($LASTEXITCODE -ne 0) { throw "7z failed with exit code $LASTEXITCODE" }
            Write-Host "[ok] v8_monolith unpacked"
          }
          finally {
            Pop-Location
          }

      # ============================================================================
      # 0.9 STEP 2: GENERATE SOLUTION (Kinc make)
      # ============================================================================
      # EDIT THIS SECTION to customize 0.9 Kinc make command
      # Starts: Line ~215 | Ends: Line ~240
      # Current command: ..\armorcore\Kinc\make.bat --from ..\armorcore -g direct3d11
      # Modify the & cmd.exe line to change graphics backend or other parameters
      # ============================================================================
      - name: "[0.9] Step 2: Generate solution (Kinc make)"
        if: env.VERSION == '0.9'
        env:
          SOURCE: ${{ steps.source.outputs.folder }}
        working-directory: ${{ env.GITHUB_WORKSPACE }}\${{ env.SOURCE }}
        run: |
          $ErrorActionPreference = "Stop"
          $diag = Join-Path (Split-Path -Parent (Split-Path -Parent $PWD)) "build-diagnostics"
          New-Item -ItemType Directory -Force -Path $diag | Out-Null

          Write-Host "=== [0.9] Step 2: Generating solution from Kinc make ==="
          & cmd.exe /d /c "..\armorcore\Kinc\make.bat --from ..\armorcore -g direct3d11" 2>&1 | Tee-Object -FilePath (Join-Path $diag "generate.log") | Write-Host

          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Write-Host "::error::Kinc make failed with exit code $code"
            throw "See build-diagnostics/generate.log for details"
          }
          Write-Host "[ok] Solution generated"

      # ============================================================================
      # MSBUILD SOLUTION (BOTH VERSIONS)
      # ============================================================================
      # EDIT THIS SECTION to customize MSBuild parameters
      # Starts: Line ~215 | Ends: Line ~250
      # Current command: /m /p:Configuration=Release /p:Platform=x64 /nologo /v:minimal
      # Modify the & $msbuild line to change build configuration or verbosity
      # ============================================================================
      - name: "[Both] Build solution with MSBuild (Release | x64)"
        env:
          SOURCE: ${{ steps.source.outputs.folder }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:VERSION
          $source = $env:SOURCE
          $sourcePath = Join-Path $env:GITHUB_WORKSPACE $source
          $sln = Join-Path $sourcePath "build\ArmorPaint.sln"

          if (!(Test-Path -LiteralPath $sln)) {
            throw "Solution not found: $sln`nDid the generate step succeed? Check build-diagnostics/generate.log"
          }

          Write-Host "Found solution: $sln"

          # Locate MSBuild
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio/Installer/vswhere.exe"
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
          if (!$msbuild) { throw "MSBuild.exe was not found" }
          Write-Host "MSBuild: $msbuild"

          $diag = Join-Path (Split-Path -Parent (Split-Path -Parent $sourcePath)) "build-diagnostics"
          New-Item -ItemType Directory -Force -Path $diag | Out-Null

          Write-Host "=== Building $version with MSBuild ==="
          & $msbuild $sln /m /p:Configuration=Release /p:Platform=x64 /nologo /v:minimal 2>&1 |
            Tee-Object -FilePath (Join-Path $diag "msbuild.log") | Write-Host

          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Write-Host "::error::MSBuild failed with exit code $code"
            throw "See build-diagnostics/msbuild.log for details"
          }
          Write-Host "[ok] Build successful"

      # ============================================================================
      # STAGE OUTPUT & VERIFY EXECUTABLE
      # ============================================================================
      # Lines ~260-290
      # Verify executable exists and copy to output folder
      # ============================================================================
      - name: Stage output and verify executable
        id: stage
        env:
          SOURCE: ${{ steps.source.outputs.folder }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:VERSION
          $source = $env:SOURCE
          $sourcePath = Join-Path $env:GITHUB_WORKSPACE $source
          $name = "ArmorPaint-$version-Windows-x64"

          # Determine where the executable ended up
          if ($version -eq "1.0") {
            $buildDir = Join-Path $sourcePath "build"
            $runtimeDir = $buildDir
          }
          else {
            $buildDir = Join-Path $sourcePath "build"
            $runtimeDir = Join-Path $buildDir "krom"

            # 0.9: Copy Release build to krom folder
            $exe = Join-Path $buildDir "x64/Release/ArmorPaint.exe"
            if (!(Test-Path -LiteralPath $exe)) {
              throw "Release build not found: $exe"
            }
            if (!(Test-Path -LiteralPath $runtimeDir)) {
              throw "build\krom was not created by make step"
            }
            Write-Host "Copying $exe to $runtimeDir"
            Copy-Item -LiteralPath $exe -Destination (Join-Path $runtimeDir "ArmorPaint.exe") -Force
          }

          # Verify executable
          $found = @(Get-ChildItem -LiteralPath $runtimeDir -Recurse -File -Filter "ArmorPaint.exe" -ErrorAction SilentlyContinue)
          if ($found.Count -eq 0) {
            throw "ArmorPaint.exe was not produced under $runtimeDir"
          }
          foreach ($f in $found) {
            Write-Host ("[ok] {0} ({1} MB)" -f $f.FullName, [math]::Round($f.Length / 1MB, 2))
          }

          # Create output directory
          $baseDir = Split-Path -Parent $sourcePath
          $output = Join-Path $baseDir "build-output/$name"
          $zip = Join-Path $baseDir "$name.zip"

          if (Test-Path -LiteralPath $output) { Remove-Item -LiteralPath $output -Recurse -Force }
          if (Test-Path -LiteralPath $zip) { Remove-Item -LiteralPath $zip -Force }
          New-Item -ItemType Directory -Force -Path $output | Out-Null

          # Copy runtime files
          Copy-Item -Path (Join-Path $runtimeDir "*") -Destination $output -Recurse -Force

          # Clean intermediates
          Get-ChildItem -LiteralPath $output -Recurse -Directory -Force |
            Where-Object { $_.Name -in @("obj", "tlog") } |
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem -LiteralPath $output -Recurse -File |
            Where-Object { $_.Extension -in @(".obj", ".ilk", ".exp", ".lib", ".pdb", ".idb", ".ipdb", ".iobj", ".tlog") } |
            Remove-Item -Force -ErrorAction SilentlyContinue

          # Check file sizes
          $big = @(Get-ChildItem -LiteralPath $output -Recurse -File | Where-Object { $_.Length -ge 95MB })
          if ($big.Count -gt 0) {
            throw "Files too large to commit (95 MB or more): $($big.Name -join ', ')"
          }

          # Create ZIP
          Compress-Archive -Path (Join-Path $output "*") -DestinationPath $zip -Force
          if ((Get-Item -LiteralPath $zip).Length -ge 95MB) {
            throw "ZIP is 95 MB or more and cannot be committed"
          }

          Write-Host "[ok] Output staged at: $output"
          Write-Host "[ok] ZIP created: $zip"

          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value @(
            "base_dir=$baseDir",
            "artifact_name=$name",
            "output_dir=$output"
          )

      - name: Upload build output as GitHub Artifact
        if: steps.stage.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ArmorPaint-${{ inputs.version }}-Windows-x64
          path: ${{ steps.stage.outputs.output_dir }}
          if-no-files-found: error

      - name: Upload build logs as GitHub Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ArmorPaint-${{ inputs.version }}-build-logs
          path: ${{ steps.stage.outputs.base_dir }}/build-diagnostics
          if-no-files-found: ignore

      # ============================================================================
      # COMMIT OUTPUT & LOGS TO REPOSITORY
      # ============================================================================
      # Lines ~350-390
      # Commits build output and logs back to main with [skip ci]
      # ============================================================================
      - name: Commit output and logs to repository
        if: always()
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:VERSION
          $baseDir = "${{ steps.stage.outputs.base_dir }}"
          $name = "ArmorPaint-$version-Windows-x64"

          $candidates = @(
            "$baseDir/build-diagnostics",
            "$baseDir/build-output/$name",
            "$baseDir/$name.zip"
          )
          $paths = @($candidates | Where-Object { Test-Path -LiteralPath $_ })

          if ($paths.Count -eq 0) {
            Write-Host "Nothing to commit."
            exit 0
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -- $paths

          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Output already matches the repository. Nothing to commit."
            exit 0
          }

          $outside = @(git diff --cached --name-only | Where-Object { $_ -notlike "$(Split-Path -Leaf $baseDir)/*" })
          if ($outside.Count -gt 0) {
            throw "Refusing to commit files outside source folder: $($outside -join ', ')"
          }

          git commit -q -m "Build ArmorPaint $version - Windows x64 [skip ci]" -m "Workflow run $env:GITHUB_RUN_ID"

          $branch = $env:GITHUB_REF_NAME
          $pushed = $false
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            git push origin "HEAD:$branch"
            if ($LASTEXITCODE -eq 0) { $pushed = $true; break }
            Write-Host "Push attempt $attempt failed. Rebasing..."
            git fetch origin $branch
            git rebase "origin/$branch"
            if ($LASTEXITCODE -ne 0) { throw "Rebase failed. Resolve manually." }
            Start-Sleep -Seconds ($attempt * 5)
          }
          if (!$pushed) { throw "Could not push after 5 attempts" }
          Write-Host "Pushed output to $branch"

      - name: Job summary
        if: always()
        run: |
          $version = $env:VERSION
          $name = "ArmorPaint-$version-Windows-x64"
          $baseDir = "${{ steps.stage.outputs.base_dir }}"
          $repo = $env:GITHUB_REPOSITORY
          $run = $env:GITHUB_RUN_ID

          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value @(
            "## ArmorPaint $version - Windows x64",
            "",
            "| Item | Value |",
            "|---|---|",
            "| Status | ${{ job.status }} |",
            "| Build output | ``build-output/$name`` |",
            "| ZIP | ``$name.zip`` |",
            "| Run | https://github.com/$repo/actions/runs/$run |"
          )
