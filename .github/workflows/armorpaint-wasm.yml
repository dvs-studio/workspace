name: ArmorPaint - Compile for WebAssembly (1.0)

# Builds ArmorPaint 1.0 for WebAssembly with the command from
# sources/armorpaint-260/readme.md, run from sources/armorpaint-260/paint:
#
#     ../base/make --target wasm --compile --embed
#
# Output, committed to the repository and uploaded as a GitHub artifact:
#   sources/armorpaint-260/build-output/ArmorPaint-1.0-WASM/
#   sources/armorpaint-260/ArmorPaint-1.0-WASM.zip
# Logs, committed but not packaged:
#   sources/armorpaint-260/build-diagnostics/

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: armorpaint-compile-wasm
  cancel-in-progress: false

jobs:
  wasm:
    name: ArmorPaint 1.0 - WebAssembly
    runs-on: ubuntu-latest
    timeout-minutes: 180

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check source folder
        run: |
          set -euo pipefail
          root=sources/armorpaint-260
          missing=0
          for rel in readme.md paint/project.js base/make base/tools/make.js; do
            if [[ -e "$root/$rel" ]]; then
              echo "[ok]      $rel"
            else
              echo "[MISSING] $rel"
              missing=1
            fi
          done
          if (( missing )); then
            echo "::error::ArmorPaint 1.0 source is incomplete. Run 'ArmorPaint - Clone and Prepare Source' for version 1.0 first."
            exit 1
          fi

      - name: Prepare build scripts
        run: |
          set -euo pipefail
          # The stored shell scripts may use CRLF line endings, which bash on
          # Linux cannot run, and may lack the execute bit. Only this runner's
          # copy changes; only the build output is committed.
          sed -i 's/\r$//' sources/armorpaint-260/base/make sources/armorpaint-260/base/tools/platform.sh
          find sources/armorpaint-260/base -type f \( -name make -o -path '*/bin/*' \) -exec chmod +x {} +

      - name: Install Emscripten
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          cd "$RUNNER_TEMP/emsdk"
          ./emsdk install latest
          ./emsdk activate latest

      - name: Build ArmorPaint 1.0 for WebAssembly (readme command)
        working-directory: sources/armorpaint-260/paint
        run: |
          set -euo pipefail
          mkdir -p ../build-diagnostics
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          bash ../base/make --target wasm --compile --embed 2>&1 | tee ../build-diagnostics/wasm-build.log

      - name: Stage output and verify
        id: stage
        run: |
          set -euo pipefail
          folder=sources/armorpaint-260
          name=ArmorPaint-1.0-WASM
          build="$folder/paint/build"

          if [[ ! -d "$build" ]]; then
            echo "::error::No build folder was created at $build"
            exit 1
          fi

          wasm=$(find "$build" -name '*.wasm' -type f | head -1 || true)
          if [[ -z "$wasm" ]]; then
            echo "::error::No .wasm file was produced under $build"
            exit 1
          fi
          echo "[ok] $wasm"

          out="$folder/build-output/$name"
          rm -rf "$out" "$folder/$name.zip"
          mkdir -p "$out"
          cp -a "$build/." "$out/"
          find "$out" -type f \( -name '*.obj' -o -name '*.ilk' -o -name '*.pdb' -o -name '*.tlog' \) -delete

          big=$(find "$out" -type f -size +94M || true)
          if [[ -n "$big" ]]; then
            echo "::error::Files too large to commit (95 MB or more): $big"
            exit 1
          fi

          (cd "$out" && zip -qr "../../$name.zip" .)
          if [[ $(stat -c '%s' "$folder/$name.zip") -ge 95000000 ]]; then
            echo "::error::The ZIP is 95 MB or more and cannot be committed as one file."
            exit 1
          fi

          echo "output_dir=$out" >> "$GITHUB_OUTPUT"

      - name: Upload build output as GitHub Artifact
        if: steps.stage.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ArmorPaint-1.0-WASM
          path: sources/armorpaint-260/build-output/ArmorPaint-1.0-WASM
          if-no-files-found: error

      - name: Upload build logs as GitHub Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ArmorPaint-1.0-WASM-build-logs
          path: sources/armorpaint-260/build-diagnostics
          if-no-files-found: ignore

      # Runs even after a failed build so the logs are kept.
      - name: Commit output and logs to repository
        if: always()
        run: |
          set -euo pipefail
          folder=sources/armorpaint-260
          name=ArmorPaint-1.0-WASM

          paths=()
          for p in "$folder/build-diagnostics" "$folder/build-output/$name" "$folder/$name.zip"; do
            if [[ -e "$p" ]]; then paths+=("$p"); fi
          done
          if (( ${#paths[@]} == 0 )); then
            echo "Nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -- "${paths[@]}"

          if git diff --cached --quiet; then
            echo "Output already matches the repository. Nothing to commit."
            exit 0
          fi

          outside=$(git diff --cached --name-only | grep -v "^$folder/" || true)
          if [[ -n "$outside" ]]; then
            echo "::error::Refusing to commit files outside $folder:"
            echo "$outside"
            exit 1
          fi

          git commit -q -m "Build ArmorPaint 1.0 - WebAssembly [skip ci]" -m "Workflow run $GITHUB_RUN_ID"

          pushed=false
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              pushed=true
              break
            fi
            echo "Push attempt $attempt failed. Rebasing onto origin/$GITHUB_REF_NAME and retrying."
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            sleep $((attempt * 5))
          done

          if [[ "$pushed" != "true" ]]; then
            echo "::error::Could not push to $GITHUB_REF_NAME after 5 attempts."
            exit 1
          fi
          echo "Pushed output to $GITHUB_REF_NAME."

      - name: Job summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## ArmorPaint 1.0 - WebAssembly"
            echo ""
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Status | $JOB_STATUS |"
            echo "| Build output | \`sources/armorpaint-260/build-output/ArmorPaint-1.0-WASM\` |"
            echo "| ZIP | \`sources/armorpaint-260/ArmorPaint-1.0-WASM.zip\` |"
            echo "| GitHub artifacts | ArmorPaint-1.0-WASM, ArmorPaint-1.0-WASM-build-logs |"
            echo "| Run | https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID |"
          } >> "$GITHUB_STEP_SUMMARY"
