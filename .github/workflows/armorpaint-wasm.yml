name: ArmorPaint - Compile for WebAssembly (1.0)

# Builds ArmorPaint 1.0 for WebAssembly with the command from
# sources/armorpaint-260/readme.md, run from sources/armorpaint-260/paint:
#
#     ../base/make --target wasm --compile --embed
#
# Output, committed to the repository and uploaded as a GitHub artifact:
#   sources/armorpaint-260/build-output/ArmorPaint-1.0-WASM/
#   sources/armorpaint-260/ArmorPaint-1.0-WASM.zip
# Logs, committed but not packaged:
#   sources/armorpaint-260/build-diagnostics/

on:
  workflow_dispatch:
    inputs:
      source_folder:
        description: "Path to source folder (default: sources/armorpaint-260/paint). Leave blank for default."
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: armorpaint-compile-wasm
  cancel-in-progress: false

jobs:
  wasm:
    name: ArmorPaint 1.0 - WebAssembly
    runs-on: ubuntu-latest
    timeout-minutes: 180

    defaults:
      run:
        shell: bash

    env:
      CUSTOM_FOLDER: ${{ inputs.source_folder }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Determine source folder
        id: source
        run: |
          set -euo pipefail
          custom="${CUSTOM_FOLDER:-}"

          if [[ -n "$custom" ]]; then
            source="$custom"
            echo "Using custom source folder: $source"
          else
            source="sources/armorpaint-260/paint"
            echo "Using default source folder: $source"
          fi

          if [[ ! -d "$source" ]]; then
            echo "::error::Source folder not found: $source"
            exit 1
          fi

          echo "folder=$source" >> "$GITHUB_OUTPUT"

      - name: Check source folder structure
        env:
          SOURCE: ${{ steps.source.outputs.folder }}
        run: |
          set -euo pipefail
          source="$SOURCE"
          base_dir=$(dirname "$source")

          echo "Checking source at: $source"

          missing=0
          for rel in readme.md project.js ../base/make ../base/tools/make.js; do
            full="$source/$rel"
            if [[ -e "$full" ]]; then
              echo "[ok]      $rel"
            else
              echo "[MISSING] $rel"
              missing=1
            fi
          done

          if (( missing )); then
            echo "::error::ArmorPaint 1.0 source is incomplete"
            exit 1
          fi

      - name: Prepare build scripts
        env:
          SOURCE: ${{ steps.source.outputs.folder }}
        run: |
          set -euo pipefail
          source="$SOURCE"
          base_dir=$(dirname "$source")

          # The stored shell scripts may use CRLF line endings, which bash on
          # Linux cannot run, and may lack the execute bit. Only this runner's
          # copy changes; only the build output is committed.
          sed -i 's/\r$//' "$base_dir/base/make" "$base_dir/base/tools/platform.sh" 2>/dev/null || true
          find "$base_dir/base" -type f \( -name make -o -path '*/bin/*' \) -exec chmod +x {} +

      - name: Install Emscripten
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          cd "$RUNNER_TEMP/emsdk"
          ./emsdk install latest
          ./emsdk activate latest

      # ============================================================================
      # BUILD WASM
      # ============================================================================
      # EDIT THIS SECTION to customize the WASM build command
      # Starts: Line ~140 | Ends: Line ~160
      # Current command: ../base/make --target wasm --compile --embed
      # Modify the bash line to change build parameters
      # ============================================================================
      - name: Build ArmorPaint 1.0 for WebAssembly
        env:
          SOURCE: ${{ steps.source.outputs.folder }}
        working-directory: ${{ env.SOURCE }}
        run: |
          set -euo pipefail
          mkdir -p ../build-diagnostics
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"

          echo "=== Building ArmorPaint 1.0 for WASM ==="
          bash ../base/make --target wasm --compile --embed 2>&1 | tee ../build-diagnostics/wasm-build.log
          echo "[ok] WASM build complete"

      - name: Stage output and verify
        id: stage
        env:
          SOURCE: ${{ steps.source.outputs.folder }}
        run: |
          set -euo pipefail
          source="$SOURCE"
          base_dir=$(dirname "$source")
          name=ArmorPaint-1.0-WASM
          build="$source/build"

          if [[ ! -d "$build" ]]; then
            echo "::error::No build folder was created at $build"
            exit 1
          fi

          wasm=$(find "$build" -name '*.wasm' -type f | head -1 || true)
          if [[ -z "$wasm" ]]; then
            echo "::error::No .wasm file was produced under $build"
            exit 1
          fi
          echo "[ok] $wasm"

          out="$base_dir/build-output/$name"
          rm -rf "$out" "$base_dir/$name.zip"
          mkdir -p "$out"
          cp -a "$build/." "$out/"
          find "$out" -type f \( -name '*.obj' -o -name '*.ilk' -o -name '*.pdb' -o -name '*.tlog' \) -delete

          big=$(find "$out" -type f -size +94M || true)
          if [[ -n "$big" ]]; then
            echo "::error::Files too large to commit (95 MB or more): $big"
            exit 1
          fi

          (cd "$out" && zip -qr "../../$name.zip" .)
          if [[ $(stat -c '%s' "$base_dir/$name.zip") -ge 95000000 ]]; then
            echo "::error::The ZIP is 95 MB or more and cannot be committed as one file."
            exit 1
          fi

          echo "[ok] Output staged and verified"
          echo "base_dir=$base_dir" >> "$GITHUB_OUTPUT"
          echo "output_dir=$out" >> "$GITHUB_OUTPUT"

      - name: Upload build output as GitHub Artifact
        if: steps.stage.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ArmorPaint-1.0-WASM
          path: ${{ steps.stage.outputs.output_dir }}
          if-no-files-found: error

      - name: Upload build logs as GitHub Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ArmorPaint-1.0-WASM-build-logs
          path: ${{ steps.stage.outputs.base_dir }}/build-diagnostics
          if-no-files-found: ignore

      # ============================================================================
      # COMMIT OUTPUT & LOGS TO REPOSITORY
      # ============================================================================
      # Runs even after a failed build so the logs are kept
      # ============================================================================
      - name: Commit output and logs to repository
        if: always()
        env:
          BASE_DIR: ${{ steps.stage.outputs.base_dir }}
        run: |
          set -euo pipefail
          base_dir="$BASE_DIR"
          name=ArmorPaint-1.0-WASM

          paths=()
          for p in "$base_dir/build-diagnostics" "$base_dir/build-output/$name" "$base_dir/$name.zip"; do
            if [[ -e "$p" ]]; then paths+=("$p"); fi
          done
          if (( ${#paths[@]} == 0 )); then
            echo "Nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -- "${paths[@]}"

          if git diff --cached --quiet; then
            echo "Output already matches the repository. Nothing to commit."
            exit 0
          fi

          base_name=$(basename "$base_dir")
          outside=$(git diff --cached --name-only | grep -v "^$base_name/" || true)
          if [[ -n "$outside" ]]; then
            echo "::error::Refusing to commit files outside source folder:"
            echo "$outside"
            exit 1
          fi

          git commit -q -m "Build ArmorPaint 1.0 - WebAssembly [skip ci]" -m "Workflow run $GITHUB_RUN_ID"

          pushed=false
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              pushed=true
              break
            fi
            echo "Push attempt $attempt failed. Rebasing..."
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            sleep $((attempt * 5))
          done

          if [[ "$pushed" != "true" ]]; then
            echo "::error::Could not push after 5 attempts."
            exit 1
          fi
          echo "Pushed output to $GITHUB_REF_NAME."

      - name: Job summary
        if: always()
        env:
          BASE_DIR: ${{ steps.stage.outputs.base_dir }}
        run: |
          {
            echo "## ArmorPaint 1.0 - WebAssembly"
            echo ""
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Status | ${{ job.status }} |"
            echo "| Build output | \`build-output/ArmorPaint-1.0-WASM\` |"
            echo "| ZIP | \`ArmorPaint-1.0-WASM.zip\` |"
            echo "| Run | https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID |"
          } >> "$GITHUB_STEP_SUMMARY"
