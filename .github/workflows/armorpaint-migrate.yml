name: ArmorPaint - Migrate Source Artifact

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Choose the ArmorPaint source version to extract"
        type: choice
        required: true
        default: "26.09"
        options:
          - "26.09"
          - "2025"
          - "0.9-September"

      run_id:
        description: "Paste the successful ArmorPaint cloning workflow Run ID"
        type: string
        required: true

permissions:
  contents: write
  actions: read

jobs:
  migrate:
    name: Extract and Migrate ArmorPaint Source
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # ---------------------------------------------------------
      # 1. CHECK OUT THE DESTINATION REPOSITORY
      # ---------------------------------------------------------
      - name: Checkout destination repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------------------------------------
      # 2. AUTOMATICALLY SELECT ARTIFACT AND DESTINATION
      # ---------------------------------------------------------
      - name: Configure migration
        id: config
        shell: bash
        env:
          SOURCE_VERSION: ${{ inputs.version }}
          SOURCE_RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "ARMORPAINT MIGRATION CONFIGURATION"
          echo "=========================================="

          case "$SOURCE_VERSION" in
            "26.09")
              ARTIFACT_NAME="armorpaint-source-26.09"
              DESTINATION="sources/armorpaint-260"
              SOURCE_REF="26.09"
              ;;

            "2025")
              ARTIFACT_NAME="armorpaint-source-2025"
              DESTINATION="sources/armorpaint-2025"
              SOURCE_REF="6c2e887777930cd72606a4360a1d33e1e48476f0"
              ;;

            "0.9-September")
              ARTIFACT_NAME="armorpaint-source-0.9-September"
              DESTINATION="sources/armorpaint-09"
              SOURCE_REF="23.09"
              ;;

            *)
              echo "::error::Unsupported ArmorPaint version."
              exit 1
              ;;
          esac

          if [[ ! "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Run ID must contain digits only."
            exit 1
          fi

          echo "Selected version: $SOURCE_VERSION"
          echo "Artifact name: $ARTIFACT_NAME"
          echo "Source workflow Run ID: $SOURCE_RUN_ID"
          echo "Destination: $DESTINATION"
          echo "Requested source reference: $SOURCE_REF"

          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          echo "destination=$DESTINATION" >> "$GITHUB_OUTPUT"
          echo "source_ref=$SOURCE_REF" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------
      # 3. CHECK DESTINATION BEFORE DOWNLOADING
      # ---------------------------------------------------------
      - name: Check destination directory
        shell: bash
        env:
          DESTINATION: ${{ steps.config.outputs.destination }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "CHECKING DESTINATION"
          echo "=========================================="

          if [[ -e "$DESTINATION" ]]; then
            echo "::error::Destination already exists: $DESTINATION"
            echo "No files have been overwritten."
            echo "Choose another version or archive the existing directory before retrying."
            exit 1
          fi

          echo "Destination is available: $DESTINATION"

      # ---------------------------------------------------------
      # 4. DOWNLOAD THE SELECTED CLONING RUN'S ARTIFACT
      # ---------------------------------------------------------
      - name: Download selected source artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.config.outputs.artifact_name }}
          path: migration-download
          repository: ${{ github.repository }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------------------------------------
      # 5. VERIFY ZIP
      # ---------------------------------------------------------
      - name: Verify source archive
        shell: bash
        env:
          SOURCE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VERIFYING SOURCE ARCHIVE"
          echo "=========================================="

          ARCHIVE="migration-download/armorpaint-source-${SOURCE_VERSION}.zip"

          if [[ ! -f "$ARCHIVE" ]]; then
            echo "::error::Expected archive not found: $ARCHIVE"
            echo "Files downloaded:"
            find migration-download -maxdepth 4 -type f -print || true
            exit 1
          fi

          echo "Archive:"
          ls -lh "$ARCHIVE"

          unzip -t "$ARCHIVE"

          echo "Archive integrity verified."

      # ---------------------------------------------------------
      # 6. SAFELY EXTRACT SOURCE ZIP
      # ---------------------------------------------------------
      - name: Extract source archive
        shell: bash
        env:
          SOURCE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          ARCHIVE="migration-download/armorpaint-source-${SOURCE_VERSION}.zip"
          EXTRACT_DIR="migration-extracted"

          echo "=========================================="
          echo "EXTRACTING SOURCE FILES"
          echo "=========================================="

          mkdir -p "$EXTRACT_DIR"

          python3 - "$ARCHIVE" "$EXTRACT_DIR" <<'PY'
          import os
          import sys
          import stat
          import zipfile
          from pathlib import PurePosixPath

          archive = sys.argv[1]
          destination = os.path.abspath(sys.argv[2])

          with zipfile.ZipFile(archive) as zf:
              entries = zf.infolist()

              if not entries:
                  raise SystemExit("The source archive contains no entries.")

              for entry in entries:
                  name = entry.filename.replace("\\", "/")
                  path = PurePosixPath(name)

                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(
                          f"Unsafe archive path rejected: {entry.filename}"
                      )

                  mode = (entry.external_attr >> 16) & 0o170000

                  if mode == stat.S_IFLNK:
                      raise SystemExit(
                          f"Symbolic link rejected: {entry.filename}"
                      )

                  target = os.path.abspath(
                      os.path.join(destination, *path.parts)
                  )

                  if os.path.commonpath([destination, target]) != destination:
                      raise SystemExit(
                          f"Archive path escapes extraction directory: {entry.filename}"
                      )

              zf.extractall(destination)

          print(f"Extracted {len(entries)} archive entries.")
          print(f"Extraction directory: {destination}")
          PY

          if [[ -z "$(find "$EXTRACT_DIR" -type f -print -quit)" ]]; then
            echo "::error::No files were extracted."
            exit 1
          fi

          echo ""
          echo "Extracted source preview:"
          find "$EXTRACT_DIR" -maxdepth 2 -mindepth 1 -print | head -200

          echo ""
          du -sh "$EXTRACT_DIR"

      # ---------------------------------------------------------
      # 7. VALIDATE AND RECORD SOURCE DETAILS
      # ---------------------------------------------------------
      - name: Validate extracted source
        id: validate
        shell: bash
        env:
          SOURCE_VERSION: ${{ inputs.version }}
          SOURCE_REF: ${{ steps.config.outputs.source_ref }}
          SOURCE_RUN_ID: ${{ inputs.run_id }}
          DESTINATION: ${{ steps.config.outputs.destination }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VALIDATING EXTRACTED SOURCE"
          echo "=========================================="

          FILE_COUNT=$(find migration-extracted -type f | wc -l | tr -d ' ')

          if [[ "$FILE_COUNT" -eq 0 ]]; then
            echo "::error::The extracted source contains no files."
            exit 1
          fi

          echo "Version: $SOURCE_VERSION"
          echo "Requested reference: $SOURCE_REF"
          echo "Source Run ID: $SOURCE_RUN_ID"
          echo "Files extracted: $FILE_COUNT"

          echo ""
          echo "Checking for common build files..."

          find migration-extracted -type f \
            \( \
              -name 'make' -o \
              -name 'make.bat' -o \
              -name 'make.js' -o \
              -name '*.sln' -o \
              -name '*.vcxproj' -o \
              -name 'CMakeLists.txt' -o \
              -name 'khafile.js' -o \
              -name 'build.hxml' \
            \) -print | head -200 || true

          echo "file_count=$FILE_COUNT" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------
      # 8. MOVE EXTRACTED SOURCE INTO VERSION-SPECIFIC DIRECTORY
      # ---------------------------------------------------------
      - name: Install source into selected directory
        shell: bash
        env:
          DESTINATION: ${{ steps.config.outputs.destination }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "INSTALLING SOURCE"
          echo "=========================================="

          if [[ -e "$DESTINATION" ]]; then
            echo "::error::Destination appeared during migration: $DESTINATION"
            exit 1
          fi

          mkdir -p "$(dirname "$DESTINATION")"
          mv migration-extracted "$DESTINATION"

          echo "Source installed at: $DESTINATION"
          echo "Source size:"
          du -sh "$DESTINATION"

      # ---------------------------------------------------------
      # 9. WRITE MIGRATION MANIFEST
      # ---------------------------------------------------------
      - name: Write source manifest
        shell: bash
        env:
          SOURCE_VERSION: ${{ inputs.version }}
          SOURCE_REF: ${{ steps.config.outputs.source_ref }}
          SOURCE_RUN_ID: ${{ inputs.run_id }}
          DESTINATION: ${{ steps.config.outputs.destination }}
        run: |
          set -euo pipefail

          MANIFEST="$DESTINATION/ARMORPAINT_SOURCE_MANIFEST.txt"

          cat > "$MANIFEST" <<EOF
          ArmorPaint Source Migration Manifest
          ====================================

          Selected version: $SOURCE_VERSION
          Requested Git reference: $SOURCE_REF
          Source cloning workflow Run ID: $SOURCE_RUN_ID
          Destination repository: $GITHUB_REPOSITORY
          Migration workflow Run ID: $GITHUB_RUN_ID
          Migration timestamp UTC: $(date -u +"%Y-%m-%dT%H:%M:%SZ")
          Source archive: armorpaint-source-$SOURCE_VERSION.zip
          Installed directory: $DESTINATION

          Important:
          This directory contains source files extracted from a GitHub Actions artifact.
          The original .git database is not included in the archive.
          Git submodule contents may be missing if their checkout failed.
          Successful extraction does not guarantee that the source will compile.
          EOF

          echo "Manifest created:"
          cat "$MANIFEST"

      # ---------------------------------------------------------
      # 10. CREATE SOURCE INVENTORY
      # ---------------------------------------------------------
      - name: Generate source inventory
        shell: bash
        env:
          DESTINATION: ${{ steps.config.outputs.destination }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "SOURCE INVENTORY"
          echo "=========================================="

          echo "Top-level entries:"
          find "$DESTINATION" -maxdepth 2 -mindepth 1 -print | head -250

          echo ""
          echo "Source size:"
          du -sh "$DESTINATION"

          echo ""
          echo "Total files:"
          find "$DESTINATION" -type f | wc -l

      # ---------------------------------------------------------
      # 11. COMMIT SOURCE INTO REPOSITORY
      # ---------------------------------------------------------
      - name: Commit migrated source
        shell: bash
        env:
          SOURCE_VERSION: ${{ inputs.version }}
          DESTINATION: ${{ steps.config.outputs.destination }}
          SOURCE_RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "COMMITTING MIGRATED SOURCE"
          echo "=========================================="

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- "$DESTINATION"

          if git diff --cached --quiet; then
            echo "No staged changes were found."
            exit 1
          fi

          # Prevent accidental commits of individual files that exceed
          # GitHub's standard 100 MB file-size limit.
          while IFS= read -r -d '' file; do
            size=$(stat -c '%s' "$file")

            if (( size > 100000000 )); then
              echo "::error::File exceeds GitHub's standard 100 MB limit: $file ($size bytes)"
              exit 1
            fi
          done < <(git diff --cached --name-only -z -- "$DESTINATION" |
                   while IFS= read -r -d '' file; do
                     if [[ -f "$file" ]]; then
                       printf '%s\0' "$file"
                     fi
                   done)

          git commit -m "Add ArmorPaint $SOURCE_VERSION source from run $SOURCE_RUN_ID"

          git push origin "HEAD:$GITHUB_REF_NAME"

          echo "Source committed successfully."

      # ---------------------------------------------------------
      # 12. FINAL SUMMARY
      # ---------------------------------------------------------
      - name: Migration summary
        if: always()
        shell: bash
        env:
          SOURCE_VERSION: ${{ inputs.version }}
          SOURCE_RUN_ID: ${{ inputs.run_id }}
          ARTIFACT_NAME: ${{ steps.config.outputs.artifact_name }}
          DESTINATION: ${{ steps.config.outputs.destination }}
          FILE_COUNT: ${{ steps.validate.outputs.file_count }}
        run: |
          echo ""
          echo "=========================================="
          echo "ARMORPAINT MIGRATION SUMMARY"
          echo "=========================================="

          echo "Selected version: $SOURCE_VERSION"
          echo "Source cloning Run ID: $SOURCE_RUN_ID"
          echo "Artifact: $ARTIFACT_NAME"
          echo "Destination: $DESTINATION"
          echo "Files extracted: $FILE_COUNT"
          echo "Migration workflow Run ID: $GITHUB_RUN_ID"
          echo ""
          echo "Review the earlier stages for any errors."
